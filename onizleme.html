<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Akıllı Kitaplık</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: a school library wall — teal header band, then shelves of face-out books on planks; tapping a cover opens the reading desk. */
:root{
  --desk:#e9f1f2; --desk-2:#dbe8ea; --card:#ffffff; --ink:#15302f; --ink-soft:#4f6a6b;
  --teal:#00adb9; --teal-deep:#00747c; --teal-wash:rgba(0,173,185,.16); --sun:#ffd43b;
  --plank:#c9dfe1; --plank-edge:#a9c8cb;
  --line:rgba(21,48,47,.12); --shadow:0 18px 40px -18px rgba(10,50,55,.45);
  --f-display:"Baloo 2","Nunito",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#0e1c1e; --desk-2:#16292c; --card:#1b3135; --ink:#e3f1f1; --ink-soft:#9fbcbe;
  --teal:#2cc6d1; --teal-deep:#6fdde4; --teal-wash:rgba(44,198,209,.22);
  --plank:#1f3a3e; --plank-edge:#2b4c51;
  --line:rgba(227,241,241,.14); --shadow:0 18px 40px -18px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#0e1c1e; --desk-2:#16292c; --card:#1b3135; --ink:#e3f1f1; --ink-soft:#9fbcbe;
  --teal:#2cc6d1; --teal-deep:#6fdde4; --teal-wash:rgba(44,198,209,.22);
  --plank:#1f3a3e; --plank-edge:#2b4c51;
  --line:rgba(227,241,241,.14); --shadow:0 18px 40px -18px rgba(0,0,0,.8); color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--f-body);font-size:15px;margin:0;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
[hidden]{display:none!important}

/* ================= LIBRARY ================= */
/* Layout: wooden bookcase — compact teal header, sticky grade tabs, one wooden shelf per grade with face-out covers on planks. */
:root{--wall:#f5efe6;--back:#f3e4cc;--back-2:#e9d4b3;--wood:#b47640;--wood-hi:#d49b62;--wood-lo:#6e4220;--label:#fffaf2;--w:clamp(118px,15.5vw,170px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--wall:#101c1e;--back:#3a2a1d;--back-2:#302217;--wood:#6b4527;--wood-hi:#8a5c36;--wood-lo:#3a2312;--label:#22343a}}
:root[data-theme="dark"]{--wall:#101c1e;--back:#3a2a1d;--back-2:#302217;--wood:#6b4527;--wood-hi:#8a5c36;--wood-lo:#3a2312;--label:#22343a}
#lib{min-height:100%;background:var(--wall)}
.band{background:#00adb9;color:#05292c;padding:12px 16px}
.band-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:14px}
.logo{background:#fff;border-radius:14px;padding:5px 7px;flex:none;display:grid;place-items:center;box-shadow:0 6px 16px -8px rgba(0,60,65,.6)}
.logo img{height:46px;width:auto;display:block}
.band h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.6rem,4vw,2.3rem);line-height:.95;margin:0;color:#04282b}
.band p{margin:2px 0 0;font-weight:700;color:#0a4246;font-size:.95rem}
.tabs{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--wall) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tabs-in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab{flex:none;border:2px solid var(--teal);background:var(--card);color:var(--teal-deep);border-radius:999px;padding:6px 16px;font-family:var(--f-display);font-weight:800;font-size:1.05rem;line-height:1.1}
.tab[aria-current="true"]{background:var(--teal);color:#05292c}
.wall{max-width:1100px;margin:0 auto;padding:18px 16px 30px}
.frame{background:linear-gradient(90deg,var(--wood-lo),var(--wood) 6%,var(--wood-hi) 50%,var(--wood) 94%,var(--wood-lo));border-radius:14px;padding:14px;box-shadow:0 24px 40px -22px rgba(60,30,10,.65)}
.case{background:repeating-linear-gradient(90deg,rgba(90,50,20,.035) 0 2px,transparent 2px 11px),linear-gradient(var(--back),var(--back-2));border-radius:6px;box-shadow:inset 0 10px 18px -8px rgba(60,30,10,.45),inset 0 0 0 1px rgba(60,30,10,.25);overflow:hidden}
.shelf{position:relative;padding:12px 0 10px;scroll-margin-top:64px}
.shelf+.shelf{box-shadow:inset 0 1px 0 rgba(110,66,32,.12)}
.shelf-h{display:flex;align-items:center;gap:8px;padding:0 16px}
.plaque{background:#00adb9;color:#04282b;font-family:var(--f-display);font-weight:800;font-size:1.15rem;line-height:1;padding:6px 12px 5px;border-radius:6px;box-shadow:0 3px 0 #00747c,0 6px 10px -6px rgba(0,0,0,.4)}
.lvl{background:var(--label);color:var(--ink-soft);border-radius:999px;padding:3px 10px;font-weight:800;font-size:.78rem}
.row{display:flex;gap:clamp(14px,2.4vw,28px);padding:12px 18px 2px;overflow-x:auto;}
.row::before,.row::after{content:"";flex:1 0 0}
.row{scroll-snap-type:x proximity;scroll-padding-inline:18px;scrollbar-width:thin;position:relative;z-index:1}
/* plank: sits right under the covers; cover height = width × 624/680 */
.rw{position:relative}
.rw::after{content:"";position:absolute;left:0;right:0;top:calc(12px + var(--w) * .9173);height:18px;
  background:linear-gradient(var(--wood-hi),var(--wood) 55%,var(--wood-lo));box-shadow:0 10px 14px -8px rgba(60,30,10,.6);z-index:0}
.bk{flex:none;width:var(--w);display:flex;flex-direction:column;border:0;background:none;padding:0;text-align:left;scroll-snap-align:start}
.cover{position:relative;border-radius:3px 7px 7px 3px;overflow:hidden;background:#fff;transform-origin:bottom center;
  box-shadow:0 12px 14px -10px rgba(40,20,5,.7),inset 5px 0 0 rgba(0,0,0,.06);transition:transform .25s cubic-bezier(.2,.8,.3,1.2),box-shadow .25s}
.cover img{display:block;width:100%;aspect-ratio:680/624;object-fit:cover}
.cover::before{content:"";position:absolute;inset:0 auto 0 0;width:8px;background:linear-gradient(90deg,rgba(0,0,0,.14),transparent);z-index:1}
.bk.ready:hover .cover,.bk.ready:focus-visible .cover{transform:translateY(-6px) scale(1.03);box-shadow:0 22px 22px -14px rgba(40,20,5,.7)}
.bk.soon{cursor:default}
.bk.soon .cover img{filter:saturate(.3) opacity(.7)}
.ph{aspect-ratio:680/624;display:grid;place-items:center;padding:10px;background:repeating-linear-gradient(135deg,#efe6d8 0 12px,#e5d8c4 12px 24px);text-align:center}
.ph span{font-family:var(--f-display);font-weight:800;font-size:.95rem;line-height:1.1;color:#6b5a44;background:#fffaf2;border-radius:8px;padding:6px 8px}
.ribbon{position:absolute;top:8px;right:-3px;background:var(--ink);color:var(--card);font-weight:800;font-size:.7rem;padding:3px 8px 3px 10px;border-radius:999px 0 0 999px;z-index:2}
.cap{margin-top:24px;background:var(--label);border-radius:8px;padding:6px 8px 7px;box-shadow:0 2px 6px -3px rgba(60,30,10,.4);display:grid;gap:5px;min-height:62px;align-content:start}
.bt{font-family:var(--f-display);font-weight:800;font-size:.95rem;line-height:1.1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink)}
.bt span{color:var(--teal-deep);margin-right:3px}
.meta{display:flex;align-items:center;gap:6px;font-size:.72rem;font-weight:800;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.bar{flex:1;height:6px;border-radius:99px;background:rgba(110,66,32,.15);overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);border-radius:99px}
.done{color:#0b7a3b}
.star{background:rgba(255,212,59,.45);color:var(--ink);border-radius:99px;padding:0 6px}
.hello{display:none}
.foot{max-width:1100px;margin:0 auto;padding:0 16px 30px;color:var(--ink-soft);font-size:.82rem;font-weight:700}
@media (max-width:760px){.frame{padding:9px;border-radius:10px}.wall{padding-inline:10px}.logo img{height:38px}.band p{font-size:.85rem}}

/* ================= READER ================= */
#reader{height:100%;display:flex;flex-direction:column;padding-inline:16px}
.rbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding-block:12px 10px}
.back{border:0;background:var(--teal);color:#062a2d;border-radius:999px;padding:7px 14px 7px 10px;font-weight:800;display:inline-flex;align-items:center;gap:4px}
.rtitle{font-family:var(--f-display);font-weight:800;font-size:1.4rem;line-height:1;margin:0 auto 0 4px;min-width:0}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;background:var(--desk-2);border-radius:999px;padding:3px;gap:2px}
.chip{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-weight:800;font-size:.85rem;color:var(--ink-soft)}
.chip[aria-pressed="true"]{background:var(--teal);color:#062a2d}
.tbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:800;font-size:.85rem;display:inline-flex;gap:6px;align-items:center}
.tbtn[aria-pressed="true"]{border-color:var(--teal);color:var(--teal-deep)}
.count{background:var(--sun);color:#3a2e00;border-radius:999px;min-width:22px;padding:0 6px;font-size:.78rem;text-align:center;font-variant-numeric:tabular-nums}

.stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
.book{display:flex;box-shadow:var(--shadow);border-radius:6px;overflow:hidden;background:#fff;max-width:100%}
.page{position:relative;aspect-ratio:680.31/623.62;height:100%;flex:none}
.page img{display:block;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none}
.page+.page::before{content:"";position:absolute;inset:0 auto 0 0;width:28px;z-index:1;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.16),rgba(0,0,0,0))}
.book.two .page:first-child::after{content:"";position:absolute;inset:0 0 0 auto;width:22px;pointer-events:none;background:linear-gradient(270deg,rgba(0,0,0,.12),rgba(0,0,0,0))}

.hit{position:absolute;border:0;padding:0;margin:0;background:transparent;border-radius:6px;z-index:2;-webkit-tap-highlight-color:transparent;transition:background-color .15s}
.hints .hit{box-shadow:inset 0 -3px 0 rgba(0,173,185,.55)}
.hints .hit.banner{box-shadow:none;outline:2px dashed rgba(0,173,185,.7);outline-offset:-2px;border-radius:14px}
.hit:hover{background:var(--teal-wash)}
.hit.sent{background:rgba(255,212,59,.22)}
.hit.on{background:rgba(0,173,185,.32);box-shadow:inset 0 -3px 0 #00adb9}
.hit.banner.on{background:rgba(0,173,185,.18)}

.nav{display:flex;justify-content:center;align-items:center;gap:14px;padding-block:8px 12px}
.nav button{border:1px solid var(--line);background:var(--card);width:46px;height:46px;border-radius:50%;font-size:1.4rem;font-weight:800;line-height:1}
.nav button:disabled{opacity:.35;cursor:default}
.nav #pno{width:auto;min-width:104px;height:46px;border-radius:999px;font-size:1rem;font-weight:800;color:var(--ink-soft);font-variant-numeric:tabular-nums;padding:0 14px}
.tip{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 16px;font-weight:800;box-shadow:var(--shadow);z-index:3;white-space:nowrap;font-size:.95rem;transition:opacity .4s}
.tip.gone{opacity:0;pointer-events:none}

.pop{position:fixed;z-index:20;width:min(360px, calc(100vw - 24px));background:var(--card);color:var(--ink);border-radius:18px;box-shadow:var(--shadow);border:1px solid var(--line);padding:14px 16px;max-height:min(70vh,560px);overflow:auto}
.pop-h{display:flex;align-items:flex-start;gap:8px}
.pop-w{font-family:var(--f-display);font-weight:800;font-size:1.7rem;line-height:1.05;margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
.round{border:0;background:var(--desk-2);width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:1.05rem}
.round.say{background:var(--teal);color:#062a2d}
.note{margin:4px 0 0;color:var(--ink-soft);font-weight:700;font-size:.88rem}
.cog{display:inline-flex;gap:6px;align-items:center;margin-top:8px;background:rgba(255,212,59,.28);color:var(--ink);border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:800}
.tr{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.wrow{display:flex;gap:12px;align-items:flex-start}
.wrow .tr{flex:1;min-width:0}
.wpic{width:96px;height:96px;border-radius:14px;object-fit:cover;flex:none;margin-top:12px;border:1px solid var(--line);background:#fff}
.bag li.pic{grid-template-columns:auto 1fr auto}
.bag li img{grid-row:1/span 2;width:44px;height:44px;border-radius:10px;object-fit:cover}
.bag li.pic small{grid-column:2}
.bag li.pic button{grid-column:3}
.clear{margin-top:12px;border:1px solid var(--line);background:var(--desk);border-radius:12px;padding:10px;font-weight:800;color:var(--ink-soft)}
.clear.sure{background:#d9534f;border-color:#d9534f;color:#fff}
@media (max-width:560px){.wpic{width:72px;height:72px}}
.tr li{display:grid;grid-template-columns:84px 1fr;gap:10px;align-items:baseline}
.tr .lb{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--teal-deep)}
.tr .tx{font-size:1.08rem;font-weight:700;min-width:0;overflow-wrap:anywhere}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.act{flex:1;border:1px solid var(--line);background:var(--desk);border-radius:12px;padding:9px 10px;font-weight:800;font-size:.88rem;white-space:nowrap}
.act[aria-pressed="true"],.act.done{border-color:var(--teal);color:var(--teal-deep);background:var(--teal-wash)}
.sentbox{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
.sentbox .tq{font-family:var(--f-display);font-weight:700;font-size:1.15rem;line-height:1.25;display:flex;gap:8px;align-items:flex-start}
.sentbox .tq span{flex:1}
.sentbox .tr .tx{font-size:.98rem;font-weight:600}

.scrim{position:fixed;inset:0;background:rgba(5,25,27,.4);z-index:30}
.drawer{position:fixed;z-index:31;top:0;right:0;bottom:0;width:min(400px,100vw);background:var(--card);color:var(--ink);box-shadow:var(--shadow);display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.drawer h2{font-family:var(--f-display);font-weight:800;font-size:1.5rem;margin:0;flex:1}
.dh{display:flex;align-items:center;gap:10px}
.drawer p{color:var(--ink-soft);margin:6px 0 12px}
.bag{list-style:none;margin:0;padding:0;overflow:auto;display:grid;gap:8px;align-content:start}
.bag li{border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.bag b{font-family:var(--f-display);font-size:1.15rem}
.bag small{grid-column:1;color:var(--ink-soft);font-weight:700;font-size:.85rem}
.bag button{grid-row:1/span 2;grid-column:2;align-self:center;border:0;background:var(--desk-2);border-radius:10px;padding:6px 10px;font-weight:800;font-size:.8rem}
.bag .empty{display:block;border:2px dashed var(--line);border-radius:16px;padding:22px;text-align:center;color:var(--ink-soft);font-weight:700}

/* quiz: Haydi, cevapla! */
.qz-scrim{position:fixed;inset:0;z-index:40;background:rgba(5,25,27,.45);display:grid;place-items:center;padding:16px}
.qz{position:relative;width:min(520px,100%);max-height:calc(100% - 8px);overflow:auto;background:var(--card);color:var(--ink);border-radius:24px;box-shadow:var(--shadow);padding:18px 20px 18px;animation:qzIn .35s cubic-bezier(.2,.8,.3,1.2)}
@keyframes qzIn{from{transform:translateY(24px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.qz-h{display:flex;align-items:center;gap:12px}
.ava{width:62px;height:62px;border-radius:50%;object-fit:cover;flex:none;border:3px solid #00adb9;background:#fff}
.qz-who{flex:1;min-width:0}
.qz-who b{display:block;font-family:var(--f-display);font-weight:800;font-size:1.35rem;line-height:1;color:var(--teal-deep)}
.qz-who small{font-weight:800;color:var(--ink-soft);font-size:.82rem}
.qz-skip{border:0;background:none;color:var(--ink-soft);font-weight:800;font-size:.85rem;padding:6px 4px}
.qz-q{display:flex;gap:10px;align-items:flex-start;margin:14px 0 6px;background:var(--desk);border-radius:18px;padding:12px 14px;position:relative}
.qz-q::before{content:"";position:absolute;left:22px;top:-9px;border:9px solid transparent;border-top:0;border-bottom-color:var(--desk)}
.qz-q p{margin:0;flex:1;font-family:var(--f-display);font-weight:700;font-size:1.35rem;line-height:1.2;text-wrap:balance}
.qz-tools{display:flex;gap:6px;flex:none}
.qz-tr{list-style:none;margin:6px 0 4px;padding:0 4px;display:grid;gap:4px}
.qz-tr li{display:grid;grid-template-columns:84px 1fr;gap:10px;font-weight:700;font-size:.95rem}
.qz-tr li span:first-child{font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--teal-deep);padding-top:2px}
.qz-opts{display:grid;gap:10px;margin-top:12px}
.qz-opts.row3{grid-template-columns:repeat(3,minmax(0,1fr))}
.qz-opts.row2{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:12px 10px;font-family:var(--f-display);font-weight:800;font-size:1.25rem;line-height:1.1;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0;transition:transform .12s,border-color .15s,background-color .15s}
.opt small{font-family:var(--f-body);font-size:.75rem;font-weight:700;color:var(--ink-soft);overflow-wrap:anywhere}
.opt img{width:78px;height:78px;border-radius:50%;object-fit:cover}
.opt:not(:disabled):hover{border-color:#00adb9;transform:translateY(-2px)}
.opt:disabled{cursor:default}
.opt.pick{border-color:#00adb9;background:var(--teal-wash)}
.opt.ok{border-color:#2f9e5b;background:rgba(47,158,91,.16)}
.opt.no{border-color:#d9534f;background:rgba(217,83,79,.14);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.slot{border:2px dashed var(--line);border-radius:14px;min-height:54px;display:grid;place-items:center;padding:6px;font-weight:800;text-align:center;font-size:.92rem;position:relative}
.slot i{position:absolute;top:4px;left:8px;font-style:normal;font-size:.7rem;color:var(--ink-soft)}
.slot.full{border-style:solid;border-color:#00adb9;background:var(--teal-wash)}
.qz-fb{min-height:1.6em;margin:14px 0 0;font-family:var(--f-display);font-weight:800;font-size:1.3rem;text-align:center}
.qz-fb.ok{color:#2f9e5b}.qz-fb.no{color:#d9534f}
.qz-fb small{display:block;font-family:var(--f-body);font-size:.9rem;color:var(--ink-soft)}
.qz-foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
.qz-btn{border:0;border-radius:999px;padding:10px 18px;font-weight:800;font-size:.95rem}
.qz-btn.main{background:#00adb9;color:#05292c}
.qz-btn.alt{background:var(--desk-2)}
.stars{font-size:2.2rem;text-align:center;margin:8px 0 0;letter-spacing:.1em}
.qz.wide{width:min(760px,100%)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-top:14px}
.pg{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:4px;display:flex;flex-direction:column;gap:4px;align-items:center;font-weight:800;font-size:.8rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.pg img{width:100%;aspect-ratio:680/624;object-fit:contain;background:var(--desk);border-radius:6px;display:block}
.pg.on{border-color:#00adb9;color:var(--teal-deep);background:var(--teal-wash)}
.pg:hover{border-color:#00adb9}
.choose{display:grid;gap:10px;margin-top:16px}
.choose .qz-btn{padding:14px 18px;font-size:1.05rem;text-align:left;display:flex;justify-content:space-between;align-items:center}
.cover-sm{width:84px;border-radius:4px 10px 10px 4px;box-shadow:0 8px 16px -10px rgba(10,50,55,.6);flex:none}
#pno{cursor:pointer;border-radius:999px;padding:6px 10px;background:var(--card);border:1px solid var(--line)}
#pno:hover{border-color:#00adb9}
.back-q{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:5;border:0;background:#00adb9;color:#05292c;border-radius:999px;padding:10px 18px;font-weight:800;box-shadow:var(--shadow)}
.hit.proof{background:rgba(255,212,59,.45);box-shadow:inset 0 -3px 0 #e0b100}
@media (max-width:560px){.qz-q p{font-size:1.15rem}.opt{font-size:1.05rem;padding:10px 6px}.opt img{width:60px;height:60px}.qz-opts.row3{gap:6px}.slots{grid-template-columns:repeat(2,minmax(0,1fr))}.ava{width:52px;height:52px}}
@media (max-width:560px){#fsBtn{display:none}.rtitle{font-size:1.15rem}.chip{padding:6px 10px}.tr li{grid-template-columns:78px 1fr}.tr .lb{font-size:.66rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<!-- LIBRARY -->
<div id="lib">
  <header class="band">
    <div class="band-in">
      <div class="logo"><img src="assets/maarif-logo.png" alt="Türkiye Maarif Vakfı"></div>
      <div><h1>Akıllı Kitaplık</h1><p>Etkileşimli Türkçe okuma kitapları</p></div>
    </div>
  </header>
  <nav class="tabs" aria-label="Sınıflar"><div class="tabs-in" id="tabs"></div></nav>
  <main class="wall" id="wallWrap"><div class="frame"><div class="case" id="wall"></div></div></main>
  <p class="foot">Kitaplar: Türkiye Maarif Vakfı Yayınları · Türkçe Okuma Kitabı serisi</p>
</div>

<!-- READER -->
<div id="reader" hidden>
  <header class="rbar">
    <button class="back" id="backBtn">‹ Raf</button>
    <h2 class="rtitle" id="rTitle"></h2>
    <div class="tools">
      <div class="seg" role="group" aria-label="Diller">
        <button class="chip" id="lang-en" data-lang="en">EN</button>
        <button class="chip" id="lang-ky" data-lang="ky">KG</button>
        <button class="chip" id="lang-ru" data-lang="ru">RU</button>
      </div>
      <button class="tbtn" id="hintBtn">İpucu</button>
      <button class="tbtn" id="quizBtn" title="Haydi, cevapla! soruları">Sorular</button>
      <button class="tbtn" id="bagBtn">Defterim <span class="count" id="bagCount">0</span></button>
      <button class="tbtn" id="fsBtn" title="Tam ekran" aria-label="Tam ekran">⛶</button>
    </div>
  </header>
  <main class="stage" id="stage">
    <div class="book" id="book"></div>
    <div class="tip gone" id="tip">Haydi, kelimeye dokun!</div>
    <button class="back-q" id="backQ" hidden>‹ Soruya dön</button>
  </main>
  <nav class="nav" aria-label="Sayfalar">
    <button id="prev" aria-label="Önceki sayfa">‹</button>
    <button id="pno" title="Sayfa seç" aria-label="Sayfa seç"></button>
    <button id="next" aria-label="Sonraki sayfa">›</button>
  </nav>
</div>

<div class="pop" id="pop" hidden role="dialog" aria-label="Kelime"></div>
<div class="qz-scrim" id="qzScrim" hidden><div class="qz" id="qz" role="dialog" aria-label="Haydi, cevapla!"></div></div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Kelime Defterim">
  <div class="dh"><h2>Kelime Defterim</h2><button class="round" id="bagClose" aria-label="Kapat">✕</button></div>
  <p>Dokun, öğren, topla!</p>
  <ul class="bag" id="bagList"></ul>
  <button class="clear" id="bagClear" hidden>Temizle</button>
</aside>

<script>
const $ = s => document.querySelector(s);
const LBL = {en:'English', ky:'Кыргызча', ru:'Русский'};
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let LIB = null, BOOK = null;
let langs = store.get('or.langs', ['en','ky','ru']);
let hints = store.get('or.hints', true);
let bag = [], cur = 1, active = null, showSent = false, two = false;

/* ---------- library ---------- */
async function loadLib(){
  if(LIB) return LIB;
  LIB = await (await fetch('library.json')).json();
  return LIB;
}
function renderLib(){
  const wall = $('#wall');
  wall.innerHTML = LIB.shelves.map(sh => `
    <section class="shelf" id="raf-${sh.id}" aria-labelledby="sh-${sh.id}">
      <div class="shelf-h"><h2 class="plaque" id="sh-${sh.id}">${sh.title}</h2><span class="lvl">${sh.sub}</span></div>
      <div class="rw"><div class="row">${sh.books.map(b => bookCard(b)).join('')}</div></div>
    </section>`).join('');
  wall.querySelectorAll('.bk.ready').forEach(el => el.onclick = () => { store.set('or.grade', el.closest('.shelf').id); chooseStart(el.dataset.id); });
  const tabs = $('#tabs');
  tabs.innerHTML = LIB.shelves.map(sh => `<button class="tab" data-to="raf-${sh.id}">${sh.title}</button>`).join('');
  const mark = id => tabs.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-current', t.dataset.to === id));
  tabs.querySelectorAll('.tab').forEach(t => t.onclick = () => { store.set('or.grade', t.dataset.to); mark(t.dataset.to); document.getElementById(t.dataset.to).scrollIntoView({behavior:'smooth', block:'start'}); });
  if(window.IntersectionObserver){
    const io = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting) mark(e.target.id); }), {rootMargin:'-45% 0px -50% 0px'});
    wall.querySelectorAll('.shelf').forEach(s => io.observe(s));
  }
  const g = store.get('or.grade', null);
  if(g && document.getElementById(g)){ mark(g); requestAnimationFrame(() => document.getElementById(g).scrollIntoView({block:'start'})); }
  else mark('raf-' + LIB.shelves[0].id);
}
function bookCard(b){
  const last = store.get('or.page.' + b.id, 0), words = store.get('or.bag.' + b.id, []).length;
  const pct = b.ready ? Math.round(Math.min(last, b.pages) / b.pages * 100) : 0;
  const status = !last ? 'Başla' : pct >= 100 ? '<span class="done">✓ Bitti</span>' : 's. ' + last;
  return `<button class="bk ${b.ready ? 'ready' : 'soon'}" data-id="${b.id}" ${b.ready ? '' : 'aria-disabled="true" tabindex="-1"'}>
    <div class="cover">${b.ready ? '' : '<span class="ribbon">Yakında</span>'}${b.cover === false ? `<div class="ph"><span>${b.title}</span></div>` : `<img src="books/${b.id}/cover.jpg" alt="${b.title} kapağı" loading="lazy">`}</div>
    <div class="cap"><div class="bt"><span>${b.no}</span>${b.title}</div>
    ${b.ready ? `<div class="meta"><div class="bar"><i style="width:${pct}%"></i></div>${status}${words ? `<span class="star" title="Kelime Defterim">★ ${words}</span>` : ''}</div>` : `<div class="meta">Hazırlanıyor</div>`}</div>
  </button>`;
}

function chooseStart(id){
  const b = LIB.shelves.flatMap(s => s.books).find(x => x.id === id), last = store.get('or.page.' + id, 0);
  if(!last || last <= 1){ store.set('or.page.' + id, 1); location.hash = id; return; }
  $('#qz').className = 'qz';
  $('#qz').innerHTML = `
    <div class="qz-h"><img class="cover-sm" src="books/${id}/cover.jpg" alt=""><div class="qz-who"><b>${b.title}</b><small>Kaldığın yer: s. ${last}</small></div></div>
    <div class="choose">
      <button class="qz-btn main" data-go="cont">Kaldığın yerden devam et <span>s. ${last} ›</span></button>
      <button class="qz-btn alt" data-go="start">Baştan başla <span>⏮</span></button>
    </div>`;
  $('#qzScrim').hidden = false;
  $('#qz').querySelector('[data-go="cont"]').onclick = () => { $('#qzScrim').hidden = true; location.hash = id; };
  $('#qz').querySelector('[data-go="start"]').onclick = () => { $('#qzScrim').hidden = true; store.set('or.page.' + id, 1); location.hash = id; };
}
$('#qzScrim').addEventListener('click', e => { if(e.target === $('#qzScrim') && !QS){ $('#qzScrim').hidden = true; } });

/* ---------- routing ---------- */
async function route(){
  closePop(); closeBag();
  await loadLib();
  const id = location.hash.replace('#', '');
  const meta = LIB.shelves.flatMap(s => s.books).find(b => b.id === id && b.ready);
  if(meta){ await openBook(meta); }
  else { $('#reader').hidden = true; $('#lib').hidden = false; renderLib(); document.title = 'Akıllı Kitaplık'; }
}
window.addEventListener('hashchange', route);
$('#backBtn').onclick = () => { location.hash = ''; };

/* ---------- reader ---------- */
async function openBook(meta){
  if(!BOOK || BOOK.id !== meta.id){
    BOOK = await (await fetch(`books/${meta.id}/book.json`)).json();
  }
  $('#lib').hidden = true; $('#reader').hidden = false;
  $('#rTitle').textContent = BOOK.title; document.title = BOOK.title + ' · Akıllı Kitaplık';
  bag = store.get('or.bag.' + BOOK.id, []);
  cur = Math.max(1, store.get('or.page.' + BOOK.id, 1));
  quizDone = new Set(); sessionStars = new Set(); $('#backQ').hidden = true;
  renderBag(); syncLangs(); syncHints(); syncQuiz(); layout();
  const tip = $('#tip'); tip.classList.remove('gone'); setTimeout(() => tip.classList.add('gone'), 5000);
}
function asp(){ return BOOK.aspect ? BOOK.aspect[0] / BOOK.aspect[1] : 680.31 / 623.62; }
function spreadOf(n){
  if(!two) return [n];
  const N = BOOK.pages.length;
  if(n === 1) return [1];
  if(n === N && N % 2 === 0) return [N];
  const l = n % 2 === 0 ? n : n - 1;
  return [l, l + 1].filter(x => x <= N);
}
function layout(){
  if($('#reader').hidden) return;
  two = window.innerWidth >= 760 && window.innerWidth > window.innerHeight * (BOOK && BOOK.aspect && asp() < 1 ? 1.2 * asp() * 2 * 0.62 : 1.05);
  draw();
}
function draw(){
  closePop();
  const pages = spreadOf(cur), bookEl = $('#book'), stage = $('#stage');
  bookEl.innerHTML = ''; bookEl.classList.toggle('two', pages.length === 2);
  pages.forEach(n => bookEl.appendChild(pageEl(BOOK.pages[n - 1])));
  // size: fit spread inside stage
  const ratio = asp() * pages.length;
  const sw = stage.clientWidth, sh = stage.clientHeight;
  let h = Math.min(sh, sw / ratio);
  bookEl.style.height = h + 'px';
  const N = BOOK.pages.length;
  $('#pno').textContent = pages.length === 2 ? `${pages[0]}–${pages[1]} / ${N}` : `${pages[0]} / ${N}`;
  $('#prev').disabled = pages[0] <= 1;
  const endQ = pages[pages.length - 1] >= N ? pendingFor(pages) : [];
  $('#next').disabled = pages[pages.length - 1] >= N && !endQ.length;
  $('#next').textContent = pages[pages.length - 1] >= N && endQ.length ? '✓' : '›';
  store.set('or.page.' + BOOK.id, pages[pages.length - 1]);
  // preload neighbours
  [pages[0] - 2, pages[0] - 1, pages[pages.length - 1] + 1, pages[pages.length - 1] + 2].forEach(n => {
    if(n >= 1 && n <= N){ const im = new Image(); im.src = `books/${BOOK.id}/${BOOK.pages[n - 1].img}`; }
  });
}
function pageEl(p){
  const pg = document.createElement('div'); pg.className = 'page';
  if(BOOK.aspect) pg.style.aspectRatio = BOOK.aspect[0] + '/' + BOOK.aspect[1];
  pg.innerHTML = `<img src="books/${BOOK.id}/${p.img}" alt="Sayfa ${p.no}">`;
  p.words.forEach(w => {
    const b = document.createElement('button');
    b.className = 'hit' + (w.banner ? ' banner' : '');
    b.style.cssText = `left:${w.b[0]}%;top:${w.b[1]}%;width:${w.b[2]}%;height:${w.b[3]}%`;
    b.setAttribute('aria-label', w.t);
    b.dataset.k = w.k; b.dataset.s = w.s;
    b.addEventListener('click', ev => { ev.stopPropagation(); openWord(b); });
    pg.appendChild(b);
  });
  return pg;
}
function go(d){
  if(!$('#qzScrim').hidden) return;
  const pages = spreadOf(cur), N = BOOK.pages.length;
  const n = d > 0 ? pages[pages.length - 1] + 1 : pages[0] - 1;
  if(d > 0){
    const q = pendingFor(pages);
    if(q.length){ startQuiz(q, () => { if(n <= N){ cur = n; draw(); } else finishCard(); }); return; }
  }
  if(n < 1 || n > N) return;
  cur = n; draw();
}
$('#pno').onclick = e => {
  e.stopPropagation(); closePop();
  const pages = spreadOf(cur), N = BOOK.pages.length;
  $('#qz').className = 'qz wide';
  $('#qz').innerHTML = `
    <div class="qz-h"><div class="qz-who"><b>Sayfa seç</b><small>${BOOK.title}</small></div><button class="round" data-x aria-label="Kapat">✕</button></div>
    <div class="pgrid">${BOOK.pages.map(p => `<button class="pg ${pages.includes(p.no) ? 'on' : ''}" data-n="${p.no}"><img src="books/${BOOK.id}/t-${String(p.no).padStart(2,'0')}.jpg" alt="" loading="lazy">${p.no === 1 ? 'Kapak' : p.no}</button>`).join('')}</div>`;
  $('#qzScrim').hidden = false;
  $('#qz').querySelector('[data-x]').onclick = () => { $('#qzScrim').hidden = true; };
  $('#qz').querySelectorAll('.pg').forEach(b => b.onclick = () => { $('#qzScrim').hidden = true; cur = +b.dataset.n; draw(); });
};
$('#prev').onclick = () => go(-1);
$('#next').onclick = () => go(1);
document.addEventListener('keydown', e => {
  if($('#reader').hidden) return;
  if(e.key === 'ArrowRight') go(1);
  if(e.key === 'ArrowLeft') go(-1);
  if(e.key === 'Escape'){ closePop(); closeBag(); }
});
let tx = null;
$('#stage').addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, {passive:true});
$('#stage').addEventListener('touchend', e => {
  if(tx === null) return; const dx = e.changedTouches[0].clientX - tx; tx = null;
  if(Math.abs(dx) > 60) go(dx < 0 ? 1 : -1);
});
let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(layout, 120); });

/* ---------- speech (optional) ---------- */
let trVoice = null;
function pickVoice(){ if(!('speechSynthesis' in window)) return; trVoice = speechSynthesis.getVoices().find(x => /^tr(-|_|$)/i.test(x.lang)) || null; }
pickVoice();
if('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => { pickVoice(); if(active) render(active); };
function say(text){ if(!trVoice) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.voice = trVoice; u.lang = trVoice.lang; u.rate = .82; speechSynthesis.speak(u); }

/* ---------- word card ---------- */
const pop = $('#pop');
function trList(o){ return `<ul class="tr">${langs.map(l => `<li><span class="lb">${LBL[l]}</span><span class="tx">${o[l]}</span></li>`).join('')}</ul>`; }
const inBag = k => bag.includes(k);
function render(btn){
  const g = BOOK.gloss[btn.dataset.k], s = BOOK.sent[btn.dataset.s];
  const spk = trVoice ? `<button class="round say" data-say="w" aria-label="Dinle">🔊</button>` : '';
  pop.innerHTML = `
    <div class="pop-h"><h2 class="pop-w">${g.w}</h2>${spk}<button class="round" data-x aria-label="Kapat">✕</button></div>
    <p class="note">${g.tr}</p>
    ${g.cog ? `<span class="cog">★ Kırgızcada da var: ${g.cog}</span>` : ''}
    <div class="wrow">${trList(g)}${g.img ? `<img class="wpic" src="books/${BOOK.id}/${g.img}" alt="${g.w}">` : ''}</div>
    <div class="acts">
      <button class="act" data-sent aria-pressed="${showSent}">Cümleyi çevir</button>
      <button class="act ${inBag(btn.dataset.k) ? 'done' : ''}" data-bag>${inBag(btn.dataset.k) ? '✓ Defterde' : '★ Deftere ekle'}</button>
    </div>
    ${showSent ? `<div class="sentbox"><div class="tq"><span>${s.tr}</span>${trVoice ? '<button class="round say" data-say="s" aria-label="Cümleyi dinle">🔊</button>' : ''}</div>${trList(s)}</div>` : ''}`;
  pop.querySelector('[data-x]').onclick = closePop;
  pop.querySelectorAll('[data-say]').forEach(b => b.onclick = () => say(b.dataset.say === 'w' ? g.w : s.tr.replace(/^[^:]+:\s*/, '')));
  pop.querySelector('[data-sent]').onclick = () => { showSent = !showSent; render(btn); place(btn); };
  pop.querySelector('[data-bag]').onclick = () => {
    const k = btn.dataset.k; bag = inBag(k) ? bag.filter(x => x !== k) : [...bag, k];
    store.set('or.bag.' + BOOK.id, bag); renderBag(); render(btn);
  };
}
function place(btn){
  const r = btn.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight, vw = innerWidth, vh = innerHeight, m = 12;
  let left = Math.min(Math.max(m, r.left + r.width / 2 - pw / 2), vw - pw - m);
  let top = r.bottom + 10;
  if(top + ph > vh - m) top = r.top - ph - 10;
  if(top < m) top = Math.max(m, vh - ph - m);
  pop.style.left = left + 'px'; pop.style.top = top + 'px';
}
function openWord(btn){
  $('#tip').classList.add('gone');
  document.querySelectorAll('.hit.on,.hit.sent').forEach(h => h.classList.remove('on', 'sent'));
  btn.parentElement.querySelectorAll(`.hit[data-s="${btn.dataset.s}"]`).forEach(h => h.classList.add(h.dataset.k === btn.dataset.k ? 'on' : 'sent'));
  active = btn; showSent = false; pop.hidden = false; render(btn); place(btn);
}
function closePop(){ pop.hidden = true; active = null; document.querySelectorAll('.hit.on,.hit.sent').forEach(h => h.classList.remove('on', 'sent')); }
pop.addEventListener('click', e => e.stopPropagation());
$('#drawer').addEventListener('click', e => e.stopPropagation());
document.addEventListener('click', () => { if(active) closePop(); });

/* ---------- languages & hints ---------- */
function syncLangs(){ document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', langs.includes(c.dataset.lang))); }
document.querySelectorAll('.chip').forEach(c => c.onclick = e => {
  e.stopPropagation(); const l = c.dataset.lang;
  if(langs.includes(l)){ if(langs.length === 1) return; langs = langs.filter(x => x !== l); }
  else langs = ['en','ky','ru'].filter(x => x === l || langs.includes(x));
  store.set('or.langs', langs); syncLangs(); if(active){ render(active); place(active); }
});
function syncHints(){ $('#book').classList.toggle('hints', hints); $('#hintBtn').setAttribute('aria-pressed', hints); }
$('#hintBtn').onclick = () => { hints = !hints; store.set('or.hints', hints); syncHints(); };

/* ---------- bag ---------- */
function renderBag(){
  $('#bagCount').textContent = bag.length;
  const ul = $('#bagList');
  const clr = $('#bagClear'); clr.hidden = !bag.length; clr.classList.remove('sure'); clr.textContent = 'Temizle';
  if(!bag.length){ ul.innerHTML = `<li class="empty">Defterin boş. Bir kelimeye dokun ve ★ ile ekle.</li>`; return; }
  ul.innerHTML = bag.map(k => { const g = BOOK.gloss[k]; if(!g) return ''; return `<li class="${g.img ? 'pic' : ''}">${g.img ? `<img src="books/${BOOK.id}/${g.img}" alt="">` : ''}<b>${g.w}</b><small>${langs.map(l => g[l]).join(' · ')}</small><button data-rm="${k}">Çıkar</button></li>`; }).join('');
  ul.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { bag = bag.filter(x => x !== b.dataset.rm); store.set('or.bag.' + BOOK.id, bag); renderBag(); });
}
function openBag(){ closePop(); renderBag(); $('#drawer').hidden = false; $('#scrim').hidden = false; }
function closeBag(){ $('#drawer').hidden = true; $('#scrim').hidden = true; }
$('#bagBtn').onclick = e => { e.stopPropagation(); openBag(); };
$('#bagClose').onclick = closeBag; $('#scrim').onclick = closeBag;
$('#bagClear').onclick = () => {
  const c = $('#bagClear');
  if(!c.classList.contains('sure')){ c.classList.add('sure'); c.textContent = 'Emin misin? Evet, hepsini sil'; return; }
  bag = []; store.set('or.bag.' + BOOK.id, bag); renderBag(); if(active) render(active);
};

/* ---------- fullscreen (optional) ---------- */
$('#fsBtn').onclick = () => { try{ if(document.fullscreenElement) document.exitFullscreen(); else { const p = document.documentElement.requestFullscreen?.(); if(p) p.catch(() => {}); } }catch(e){} };
if(!document.documentElement.requestFullscreen) $('#fsBtn').hidden = true;

/* ---------- Haydi, cevapla! ---------- */
let quizOn = store.get('or.quiz', true), quizDone = new Set(), QS = null;
function syncQuiz(){ $('#quizBtn').setAttribute('aria-pressed', quizOn); $('#quizBtn').hidden = !(BOOK && BOOK.quiz && BOOK.quiz.length); }
$('#quizBtn').onclick = () => { quizOn = !quizOn; store.set('or.quiz', quizOn); syncQuiz(); draw(); };
function pendingFor(pages){
  if(!quizOn || !BOOK || !BOOK.quiz) return [];
  return BOOK.quiz.filter(q => q.after >= pages[0] && q.after <= pages[pages.length - 1] && !quizDone.has(q.id));
}
const SCORABLE = t => ['mc','tf','who','order'].includes(t);
let sessionStars = new Set();
function giveStar(q){ sessionStars.add(q.id); }
function startQuiz(list, done){ closePop(); $('#qz').className = 'qz'; QS = {list, i:0, done, st:{}}; showQ(); }
function shuffle(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function showQ(){
  const q = QS.list[QS.i], host = BOOK.host || {name:'', face:''};
  const st = QS.st[q.id] || (QS.st[q.id] = {tries:0, state:'open', pick:null, order:[], tr:false, mix: q.type === 'order' ? shuffle(q.options.map((o, i) => i)) : null});
  const qz = $('#qz'), trOn = st.tr;
  const trBlock = o => o ? `<ul class="qz-tr">${langs.map(l => `<li><span>${LBL[l]}</span><span>${o[l]}</span></li>`).join('')}</ul>` : '';
  const optSub = o => trOn && o.tt ? `<small>${langs.map(l => o.tt[l]).join(' · ')}</small>` : '';
  let body = '';
  if(['mc','tf','who','predict'].includes(q.type)){
    const n = q.options.length;
    const allFaces = q.options.every(o => o.face);  // pictures only when every option has one
    body = `<div class="qz-opts ${n === 2 ? 'row2' : 'row3'}">${q.options.map((o, i) => {
      let cls = '';
      if(st.pick === i) cls = q.type === 'predict' ? 'pick' : (i === q.answer ? 'ok' : 'no');
      if(st.state !== 'open' && q.answer === i && q.type !== 'predict') cls = 'ok';
      return `<button class="opt ${cls}" data-i="${i}" ${st.state !== 'open' ? 'disabled' : ''}>${allFaces ? `<img src="books/${BOOK.id}/${o.face}" alt="">` : ''}${o.t}${optSub(o)}</button>`;
    }).join('')}</div>`;
  } else if(q.type === 'order'){
    const placed = st.state === 'revealed' ? q.options.map((o, i) => i) : st.order;
    body = `<div class="slots">${[0,1,2,3].slice(0, q.options.length).map(k => `<div class="slot ${placed[k] !== undefined ? 'full' : ''}"><i>${k + 1}</i>${placed[k] !== undefined ? q.options[placed[k]].t : ''}</div>`).join('')}</div>
      <div class="qz-opts row2">${st.mix.map(i => `<button class="opt ${placed.includes(i) ? 'pick' : ''}" data-i="${i}" ${placed.includes(i) || st.state !== 'open' ? 'disabled' : ''}>${q.options[i].t}${optSub(q.options[i])}</button>`).join('')}</div>`;
  } else if(q.type === 'talk'){
    body = `<p class="qz-fb">${q.tip || ''}${trOn && q.tipt ? `<small>${langs.map(l => q.tipt[l]).join(' · ')}</small>` : ''}</p>`;
  }
  let fb = '', foot = '';
  const findBtn = q.find ? `<button class="qz-btn alt" data-find>📖 Kitapta bul</button>` : '';
  const nextBtn = `<button class="qz-btn main" data-next>Devam ›</button>`;
  if(q.type === 'talk'){ foot = nextBtn; }
  else if(st.state === 'ok'){ fb = `<p class="qz-fb ok">Aferin! 🎉</p>`; foot = findBtn + nextBtn; }
  else if(st.state === 'revealed'){ fb = `<p class="qz-fb no">Doğru cevap bu.<small>Kitapta birlikte bakalım!</small></p>`; foot = findBtn + nextBtn; }
  else if(st.state === 'seen'){ fb = `<p class="qz-fb">Haydi, okuyalım ve görelim!</p>`; foot = nextBtn; }
  else if(st.tries === 1){ fb = `<p class="qz-fb no">Bir daha dene!</p>`; }
  const spk = trVoice ? `<button class="round say" data-say aria-label="Dinle">🔊</button>` : '';
  qz.innerHTML = `
    <div class="qz-h">${host.face ? `<img class="ava" src="books/${BOOK.id}/${host.face}" alt="${host.name}">` : ''}
      <div class="qz-who"><b>Haydi, cevapla!</b><small>${host.name ? host.name + ' soruyor' : ''} · ${QS.i + 1}/${QS.list.length}</small></div>
      ${st.state === 'open' && q.type !== 'talk' ? '<button class="qz-skip" data-skip>Geç ›</button>' : ''}</div>
    <div class="qz-q"><p>${q.q}</p><div class="qz-tools">${spk}<button class="round" data-tr aria-pressed="${trOn}" aria-label="Çevir" title="Çevir">文</button></div></div>
    ${trOn ? trBlock(q.qt) : ''}
    ${body}${fb}
    ${foot ? `<div class="qz-foot">${foot}</div>` : ''}`;
  $('#qzScrim').hidden = false;
  qz.querySelector('[data-tr]').onclick = () => { st.tr = !st.tr; showQ(); };
  qz.querySelector('[data-say]')?.addEventListener('click', () => say(q.q));
  qz.querySelector('[data-skip]')?.addEventListener('click', nextQ);
  qz.querySelector('[data-next]')?.addEventListener('click', nextQ);
  qz.querySelector('[data-find]')?.addEventListener('click', () => findInBook(q));
  qz.querySelectorAll('.opt:not(:disabled)').forEach(b => b.onclick = () => answer(q, st, +b.dataset.i));
}
function answer(q, st, i){
  if(q.type === 'predict'){ st.pick = i; st.state = 'seen'; return showQ(); }
  if(q.type === 'order'){
    st.order.push(i);
    if(st.order.length < q.options.length) return showQ();
    const right = st.order.every((v, k) => v === k);
    st.tries++;
    if(right){ st.state = 'ok'; giveStar(q); }
    else if(st.tries >= 2){ st.state = 'revealed'; }
    else { st.order = []; }
    return showQ();
  }
  st.pick = i; st.tries++;
  if(i === q.answer){ st.state = 'ok'; giveStar(q); }
  else if(st.tries >= 2){ st.state = 'revealed'; }
  showQ();
}
function nextQ(){
  quizDone.add(QS.list[QS.i].id);
  if(QS.i < QS.list.length - 1){ QS.i++; return showQ(); }
  $('#qzScrim').hidden = true; const d = QS.done; QS = null; d && d();
}
let returnTo = null;
function findInBook(q){
  $('#qzScrim').hidden = true; returnTo = cur; $('#tip').classList.add('gone');
  cur = q.find.page; draw();
  document.querySelectorAll(`.hit[data-s="${q.find.s}"]`).forEach(h => h.classList.add('proof'));
  $('#backQ').hidden = false;
}
$('#backQ').onclick = () => { $('#backQ').hidden = true; if(returnTo){ cur = returnTo; returnTo = null; draw(); } if(QS) showQ(); };
function finishCard(){
  $('#qz').className = 'qz';
  const total = BOOK.quiz.filter(q => SCORABLE(q.type)).length, got = sessionStars.size;
  const host = BOOK.host || {};
  $('#qz').innerHTML = `
    <div class="qz-h">${host.face ? `<img class="ava" src="books/${BOOK.id}/${host.face}" alt="">` : ''}<div class="qz-who"><b>Tebrikler!</b><small>Kitabı bitirdin.</small></div></div>
    <p class="stars" aria-label="${got} / ${total}">${'⭐'.repeat(got)}${'☆'.repeat(Math.max(0, total - got))}</p>
    <p class="qz-fb">${got} / ${total}</p>
    <div class="qz-foot"><button class="qz-btn alt" data-close>Kapat</button><button class="qz-btn alt" data-again>⏮ Baştan oku</button><button class="qz-btn main" data-shelf>Rafa dön</button></div>`;
  $('#qzScrim').hidden = false;
  $('#qz').querySelector('[data-close]').onclick = () => { $('#qzScrim').hidden = true; draw(); };
  $('#qz').querySelector('[data-again]').onclick = () => { $('#qzScrim').hidden = true; quizDone = new Set(); sessionStars = new Set(); cur = 1; draw(); };
  $('#qz').querySelector('[data-shelf]').onclick = () => { $('#qzScrim').hidden = true; location.hash = ''; };
}
$('#qz').addEventListener('click', e => e.stopPropagation());

route();
</script>
