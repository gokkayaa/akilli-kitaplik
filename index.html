<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Akıllı Kitaplık</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Outfit:wght@300;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: a school library wall — teal header band, then shelves of face-out books on planks; tapping a cover opens the reading desk. */
:root{
  --desk:#e9f1f2; --desk-2:#dbe8ea; --card:#ffffff; --ink:#15302f; --ink-soft:#4f6a6b;
  --teal:#00adb9; --teal-deep:#00747c; --teal-wash:rgba(0,173,185,.16); --sun:#ffd43b;
  --plank:#c9dfe1; --plank-edge:#a9c8cb;
  --line:rgba(21,48,47,.12); --shadow:0 18px 40px -18px rgba(10,50,55,.45);
  --f-display:"Baloo 2","Nunito",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#0e1c1e; --desk-2:#16292c; --card:#1b3135; --ink:#e3f1f1; --ink-soft:#9fbcbe;
  --teal:#2cc6d1; --teal-deep:#6fdde4; --teal-wash:rgba(44,198,209,.22);
  --plank:#1f3a3e; --plank-edge:#2b4c51;
  --line:rgba(227,241,241,.14); --shadow:0 18px 40px -18px rgba(0,0,0,.8); color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#0e1c1e; --desk-2:#16292c; --card:#1b3135; --ink:#e3f1f1; --ink-soft:#9fbcbe;
  --teal:#2cc6d1; --teal-deep:#6fdde4; --teal-wash:rgba(44,198,209,.22);
  --plank:#1f3a3e; --plank-edge:#2b4c51;
  --line:rgba(227,241,241,.14); --shadow:0 18px 40px -18px rgba(0,0,0,.8); color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--f-body);font-size:15px;margin:0;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
[hidden]{display:none!important}

/* ================= LIBRARY ================= */
/* Kayan kapak duvarı: sütunlar sırayla aşağı/yukarı akar; seviye seçilince o setin kitapları renklenir, altta seri listelenir. */
:root{--lb-deep:#0b4f55;--lb-night:#062f33;--lb-sun:#ffc83d;--lb-coral:#ff6f5e}
#lib{min-height:100%;background:var(--lb-deep);color:#fff}
.band{position:absolute;top:0;left:0;right:0;z-index:6;pointer-events:none}
.band-in{padding:22px 32px;display:flex;align-items:center;gap:14px}
#lib{position:relative}
.wm{margin:0;font:300 clamp(1.9rem,4vw,2.5rem)/1 Outfit,var(--f-display);letter-spacing:-.02em;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.35)}
.wm b{font-weight:800}
.wm i{display:inline-block;width:.3em;height:.3em;border-radius:50%;background:#00adb9;margin-left:.08em}
.mlogo{margin-left:auto;height:60px;width:auto;display:block}
.wallx{position:relative;height:min(52vh,470px);overflow:hidden;background:var(--lb-night)}
.wallx::before{content:"";position:absolute;left:0;right:0;top:0;height:150px;z-index:2;pointer-events:none;background:linear-gradient(rgba(6,47,51,.92),rgba(6,47,51,.55) 55%,transparent)}
.cols{position:absolute;inset:-160px -140px;display:flex;gap:12px;transform:rotate(-8deg);transition:opacity .25s}
.wallx.shuffle .cols{opacity:0}
.col{flex:1;min-width:0}
.track{display:flex;flex-direction:column;gap:12px;animation:lbUp var(--d) linear infinite}
.col:nth-child(even) .track{animation-name:lbDown}
@keyframes lbUp{from{transform:translateY(0)}to{transform:translateY(calc(-50% - 6px))}}
@keyframes lbDown{from{transform:translateY(calc(-50% - 6px))}to{transform:translateY(0)}}
@media (hover:hover) and (pointer:fine){.cols:hover .track{animation-play-state:paused}}
.tile{position:relative;display:block;width:100%;padding:0;border:0;background:#0d3a3e;border-radius:10px;overflow:hidden;aspect-ratio:1/1;transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s}
.tile img{display:block;width:100%;height:100%;object-fit:cover;object-position:top;transition:filter .6s,opacity .6s}
.wallx.pick .tile img{filter:grayscale(1) brightness(.45);opacity:.6}
.wallx.pick .tile.hi img{filter:none;opacity:1}
.wallx.pick .tile.hi{box-shadow:0 0 0 4px var(--lb-sun),0 18px 30px -12px #000;transform:scale(1.04)}
.tile:hover{transform:scale(1.06)}
.wallx::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(6,47,51,.55),transparent 18%,transparent 70%,rgba(6,47,51,.9))}
.levels{position:absolute;z-index:3;left:50%;bottom:18px;transform:translateX(-50%);width:max-content;max-width:calc(100vw - 24px);display:flex;gap:6px;padding:8px;border-radius:22px;background:rgba(6,47,51,.8);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 20px 40px -20px #000;overflow-x:auto;scrollbar-width:none}
.levels::-webkit-scrollbar{display:none}
.lvb{flex:none;display:flex;flex-direction:column;align-items:center;border:0;background:none;color:#fff;padding:7px 14px;border-radius:15px;transition:background .25s,color .25s}
.lvb b{font-family:var(--f-display);font-weight:800;font-size:1.2rem;line-height:1.05}
.lvb small{font-size:.78rem;font-weight:700;opacity:.75}
.lvb:hover{background:rgba(255,255,255,.1)}
.lvb[aria-pressed="true"]{background:var(--lb-sun);color:#3b2a00}
.series{max-width:1280px;margin:0 auto;padding:28px 32px 40px}
.series header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.series h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:2.4rem;line-height:1}
.series .sm{color:#a8dde1;font-weight:700}
.series .hint{margin:0 0 0 auto;color:#a8dde1;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:26px;margin-top:22px}
.bk{display:block;border:0;background:none;color:#fff;padding:0;text-align:left;animation:lbRise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--k)*60ms)}
@keyframes lbRise{from{opacity:0;transform:translateY(18px)}}
.bk .c{display:block;position:relative;border-radius:4px 14px 14px 4px;overflow:hidden;aspect-ratio:1/1;background:#0d3a3e;box-shadow:0 22px 34px -22px #000;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.bk .c::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;z-index:1;background:linear-gradient(90deg,rgba(0,0,0,.25),rgba(255,255,255,.15) 60%,transparent)}
.bk .c img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
.bk.ready:hover .c,.bk.ready:focus-visible .c{transform:translateY(-6px) rotate(-1.5deg)}
.bk .t{display:block;margin-top:12px;font-family:var(--f-display);font-weight:700;font-size:1.08rem;line-height:1.2}
.bk.soon{cursor:default}.bk.soon .c img{filter:saturate(.35) brightness(.8)}
.wave{position:absolute;z-index:2;left:8px;bottom:8px;display:flex;align-items:center;gap:2px;height:28px;padding:0 8px;border-radius:99px;background:rgba(255,255,255,.95)}
.wave i{display:block;width:3px;height:6px;border-radius:2px;background:#00adb9}
.wave i:nth-child(2){height:12px}.wave i:nth-child(3){height:16px}.wave i:nth-child(4){height:10px}
.bk:hover .wave i{animation:lbW .9s ease-in-out infinite}
.bk:hover .wave i:nth-child(2){animation-delay:.12s}.bk:hover .wave i:nth-child(3){animation-delay:.24s}.bk:hover .wave i:nth-child(4){animation-delay:.36s}
@keyframes lbW{50%{transform:scaleY(.35)}}
.newt{position:absolute;z-index:2;top:10px;right:10px;background:var(--lb-coral);color:#fff;font-weight:800;font-size:.8rem;padding:4px 9px;border-radius:9px;transform:rotate(6deg)}
.soont{position:absolute;z-index:2;top:10px;right:10px;background:#fff;color:#04282b;font-weight:800;font-size:.8rem;padding:4px 9px;border-radius:9px}
.okd{position:absolute;z-index:2;right:8px;bottom:8px;width:30px;height:30px;border-radius:50%;background:#1aa772;color:#fff;display:grid;place-items:center}
.okd .ic{width:16px;height:16px}
.cnt{margin-left:10px;opacity:.7;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.cnt b{font-weight:800}
.foot{max-width:1280px;margin:0 auto;padding:0 32px 30px;color:#8fc9ce;font-size:.82rem;font-weight:700}
@media (max-width:760px){.band-in{padding:16px}.mlogo{height:44px}.wallx{height:50vh}.cols{inset:-120px -160px}
  .series{padding:24px 16px 30px}.series .hint{display:none}.series h2{font-size:2rem}
  .grid{grid-template-columns:repeat(2,1fr);gap:18px}.foot{padding-inline:16px}}
@media (prefers-reduced-motion:reduce){.track,.bk,.wave i{animation:none!important}.tile,.tile img,.cols{transition:none}}

/* ================= READER ================= */
#reader{height:100%;display:flex;flex-direction:column;padding-inline:16px}
.rbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding-block:12px 10px}
.back{border:0;background:var(--teal);color:#062a2d;border-radius:999px;padding:7px 14px 7px 10px;font-weight:800;display:inline-flex;align-items:center;gap:4px}
.rtitle{font-family:var(--f-display);font-weight:800;font-size:1.4rem;line-height:1;margin:0 auto 0 4px;min-width:0}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;background:var(--desk-2);border-radius:999px;padding:3px;gap:2px}
.chip{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-weight:800;font-size:.85rem;color:var(--ink-soft)}
.chip[aria-pressed="true"]{background:var(--teal);color:#062a2d}
.tbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:800;font-size:.85rem;display:inline-flex;gap:6px;align-items:center}
.tbtn[aria-pressed="true"]{border-color:var(--teal);color:var(--teal-deep)}
.count{background:var(--sun);color:#3a2e00;border-radius:999px;min-width:22px;padding:0 6px;font-size:.78rem;text-align:center;font-variant-numeric:tabular-nums}

.stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
.book{display:flex;box-shadow:var(--shadow);border-radius:6px;overflow:hidden;background:#fff;max-width:100%}
.page{position:relative;aspect-ratio:680.31/623.62;height:100%;flex:none}
.page img{display:block;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none}
.page+.page::before{content:"";position:absolute;inset:0 auto 0 0;width:28px;z-index:1;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.16),rgba(0,0,0,0))}
.book.two .page:first-child::after{content:"";position:absolute;inset:0 0 0 auto;width:22px;pointer-events:none;background:linear-gradient(270deg,rgba(0,0,0,.12),rgba(0,0,0,0))}

.hit{position:absolute;border:0;padding:0;margin:0;background:transparent;border-radius:6px;z-index:2;-webkit-tap-highlight-color:transparent;transition:background-color .15s}
.hints .hit{box-shadow:inset 0 -3px 0 rgba(0,173,185,.55)}
.hints .hit.banner{box-shadow:none;outline:2px dashed rgba(0,173,185,.7);outline-offset:-2px;border-radius:14px}
.hit:hover{background:var(--teal-wash)}
.hit.sent{background:rgba(255,212,59,.22)}
.hit.on{background:rgba(0,173,185,.32);box-shadow:inset 0 -3px 0 #00adb9}
.hit.banner.on{background:rgba(0,173,185,.18)}

.nav{display:flex;justify-content:center;align-items:center;gap:14px;padding-block:8px 12px}
.nav button{border:1px solid var(--line);background:var(--card);width:46px;height:46px;border-radius:50%;font-size:1.4rem;font-weight:800;line-height:1}
.nav button:disabled{opacity:.35;cursor:default}
.nav #pno{width:auto;min-width:104px;height:46px;border-radius:999px;font-size:1rem;font-weight:800;color:var(--ink-soft);font-variant-numeric:tabular-nums;padding:0 14px}
.tip{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 16px;font-weight:800;box-shadow:var(--shadow);z-index:3;white-space:nowrap;font-size:.95rem;transition:opacity .4s}
.tip.gone{opacity:0;pointer-events:none}

.pop{position:fixed;z-index:20;width:min(360px, calc(100vw - 24px));background:var(--card);color:var(--ink);border-radius:18px;box-shadow:var(--shadow);border:1px solid var(--line);padding:14px 16px;max-height:min(70vh,560px);overflow:auto}
.pop-h{display:flex;align-items:flex-start;gap:8px}
.pop-w{font-family:var(--f-display);font-weight:800;font-size:1.7rem;line-height:1.05;margin:0;flex:1;min-width:0;overflow-wrap:anywhere}
.round{border:0;background:var(--desk-2);width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:1.05rem}
.round.say{background:var(--teal);color:#062a2d}
.note{margin:4px 0 0;color:var(--ink-soft);font-weight:700;font-size:.88rem}
.cog{display:inline-flex;gap:6px;align-items:center;margin-top:8px;background:rgba(255,212,59,.28);color:var(--ink);border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:800}
.tr{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.wrow{display:flex;gap:12px;align-items:flex-start}
.wrow .tr{flex:1;min-width:0}
.wpic{width:96px;height:96px;border-radius:14px;object-fit:cover;flex:none;margin-top:12px;border:1px solid var(--line);background:#fff}
.bag li.pic{grid-template-columns:auto 1fr auto}
.bag li img{grid-row:1/span 2;width:44px;height:44px;border-radius:10px;object-fit:cover}
.bag li.pic small{grid-column:2}
.bag li.pic button{grid-column:3}
.clear{margin-top:12px;border:1px solid var(--line);background:var(--desk);border-radius:12px;padding:10px;font-weight:800;color:var(--ink-soft)}
.clear.sure{background:#d9534f;border-color:#d9534f;color:#fff}
@media (max-width:560px){.wpic{width:72px;height:72px}}
.tr li{display:grid;grid-template-columns:84px 1fr;gap:10px;align-items:baseline}
.tr .lb{font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--teal-deep)}
.tr .tx{font-size:1.08rem;font-weight:700;min-width:0;overflow-wrap:anywhere}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.act{flex:1;border:1px solid var(--line);background:var(--desk);border-radius:12px;padding:9px 10px;font-weight:800;font-size:.88rem;white-space:nowrap}
.act[aria-pressed="true"],.act.done{border-color:var(--teal);color:var(--teal-deep);background:var(--teal-wash)}
.sentbox{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
.sentbox .tq{font-family:var(--f-display);font-weight:700;font-size:1.15rem;line-height:1.25;display:flex;gap:8px;align-items:flex-start}
.sentbox .tq span{flex:1}
.sentbox .tr .tx{font-size:.98rem;font-weight:600}

.scrim{position:fixed;inset:0;background:rgba(5,25,27,.4);z-index:30}
.drawer{position:fixed;z-index:31;top:0;right:0;bottom:0;width:min(400px,100vw);background:var(--card);color:var(--ink);box-shadow:var(--shadow);display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.drawer h2{font-family:var(--f-display);font-weight:800;font-size:1.5rem;margin:0;flex:1}
.dh{display:flex;align-items:center;gap:10px}
.drawer p{color:var(--ink-soft);margin:6px 0 12px}
.bag{list-style:none;margin:0;padding:0;overflow:auto;display:grid;gap:8px;align-content:start}
.bag li{border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.bag b{font-family:var(--f-display);font-size:1.15rem}
.bag small{grid-column:1;color:var(--ink-soft);font-weight:700;font-size:.85rem}
.bag button{grid-row:1/span 2;grid-column:2;align-self:center;border:0;background:var(--desk-2);border-radius:10px;padding:6px 10px;font-weight:800;font-size:.8rem}
.bag .empty{display:block;border:2px dashed var(--line);border-radius:16px;padding:22px;text-align:center;color:var(--ink-soft);font-weight:700}

/* quiz: Haydi, cevapla! */
.qz-scrim{position:fixed;inset:0;z-index:40;background:rgba(5,25,27,.45);display:grid;place-items:center;padding:16px}
.qz{position:relative;width:min(520px,100%);max-height:calc(100% - 8px);overflow:auto;background:var(--card);color:var(--ink);border-radius:24px;box-shadow:var(--shadow);padding:18px 20px 18px;animation:qzIn .35s cubic-bezier(.2,.8,.3,1.2)}
@keyframes qzIn{from{transform:translateY(24px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.qz-h{display:flex;align-items:center;gap:12px}
.ava{width:62px;height:62px;border-radius:50%;object-fit:cover;flex:none;border:3px solid #00adb9;background:#fff}
.qz-who{flex:1;min-width:0}
.qz-who b{display:block;font-family:var(--f-display);font-weight:800;font-size:1.35rem;line-height:1;color:var(--teal-deep)}
.qz-who small{font-weight:800;color:var(--ink-soft);font-size:.82rem}
.qz-skip{border:0;background:none;color:var(--ink-soft);font-weight:800;font-size:.85rem;padding:6px 4px}
.qz-q{display:flex;gap:10px;align-items:flex-start;margin:14px 0 6px;background:var(--desk);border-radius:18px;padding:12px 14px;position:relative}
.qz-q::before{content:"";position:absolute;left:22px;top:-9px;border:9px solid transparent;border-top:0;border-bottom-color:var(--desk)}
.qz-q p{margin:0;flex:1;font-family:var(--f-display);font-weight:700;font-size:1.35rem;line-height:1.2;text-wrap:balance}
.qz-tools{display:flex;gap:6px;flex:none}
.qz-tr{list-style:none;margin:6px 0 4px;padding:0 4px;display:grid;gap:4px}
.qz-tr li{display:grid;grid-template-columns:84px 1fr;gap:10px;font-weight:700;font-size:.95rem}
.qz-tr li span:first-child{font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--teal-deep);padding-top:2px}
.qz-opts{display:grid;gap:10px;margin-top:12px}
.qz-opts.row3{grid-template-columns:repeat(3,minmax(0,1fr))}
.qz-opts.row2{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:12px 10px;font-family:var(--f-display);font-weight:800;font-size:1.25rem;line-height:1.1;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0;transition:transform .12s,border-color .15s,background-color .15s}
.opt small{font-family:var(--f-body);font-size:.75rem;font-weight:700;color:var(--ink-soft);overflow-wrap:anywhere}
.opt img{width:78px;height:78px;border-radius:50%;object-fit:cover}
.opt:not(:disabled):hover{border-color:#00adb9;transform:translateY(-2px)}
.opt:disabled{cursor:default}
.opt.pick{border-color:#00adb9;background:var(--teal-wash)}
.opt.ok{border-color:#2f9e5b;background:rgba(47,158,91,.16)}
.opt.no{border-color:#d9534f;background:rgba(217,83,79,.14);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.slot{border:2px dashed var(--line);border-radius:14px;min-height:54px;display:grid;place-items:center;padding:6px;font-weight:800;text-align:center;font-size:.92rem;position:relative}
.slot i{position:absolute;top:4px;left:8px;font-style:normal;font-size:.7rem;color:var(--ink-soft)}
.slot.full{border-style:solid;border-color:#00adb9;background:var(--teal-wash)}
.qz-fb{min-height:1.6em;margin:14px 0 0;font-family:var(--f-display);font-weight:800;font-size:1.3rem;text-align:center}
.qz-fb.ok{color:#2f9e5b}.qz-fb.no{color:#d9534f}
.qz-fb small{display:block;font-family:var(--f-body);font-size:.9rem;color:var(--ink-soft)}
.qz-foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}
.qz-btn{border:0;border-radius:999px;padding:10px 18px;font-weight:800;font-size:.95rem}
.qz-btn.main{background:#00adb9;color:#05292c}
.qz-btn.alt{background:var(--desk-2)}
.stars{font-size:2.2rem;text-align:center;margin:8px 0 0;letter-spacing:.1em}
.qz.wide{width:min(760px,100%)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-top:14px}
.pg{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:4px;display:flex;flex-direction:column;gap:4px;align-items:center;font-weight:800;font-size:.8rem;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.pg img{width:100%;aspect-ratio:680/624;object-fit:contain;background:var(--desk);border-radius:6px;display:block}
.pg.on{border-color:#00adb9;color:var(--teal-deep);background:var(--teal-wash)}
.pg:hover{border-color:#00adb9}
.choose{display:grid;gap:10px;margin-top:16px}
.choose .qz-btn{padding:14px 18px;font-size:1.05rem;text-align:left;display:flex;justify-content:space-between;align-items:center}
.cover-sm{width:84px;border-radius:4px 10px 10px 4px;box-shadow:0 8px 16px -10px rgba(10,50,55,.6);flex:none}
#pno{cursor:pointer;border-radius:999px;padding:6px 10px;background:var(--card);border:1px solid var(--line)}
#pno:hover{border-color:#00adb9}
.back-q{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:5;border:0;background:#00adb9;color:#05292c;border-radius:999px;padding:10px 18px;font-weight:800;box-shadow:var(--shadow)}
.hit.proof{background:rgba(255,212,59,.45);box-shadow:inset 0 -3px 0 #e0b100}
@media (max-width:560px){.qz-q p{font-size:1.15rem}.opt{font-size:1.05rem;padding:10px 6px}.opt img{width:60px;height:60px}.qz-opts.row3{gap:6px}.slots{grid-template-columns:repeat(2,minmax(0,1fr))}.ava{width:52px;height:52px}}
@media (max-width:560px){#fsBtn{display:none}.rtitle{font-size:1.15rem}.chip{padding:6px 10px}.tr li{grid-template-columns:78px 1fr}.tr .lb{font-size:.66rem}}

/* ================= TEACHER MODE ================= */
#teachBtn[aria-pressed="true"]{background:#00adb9;border-color:#00adb9;color:#05292c}
.ttools{display:none;gap:2px;background:var(--desk-2);border-radius:999px;padding:3px}
.teach .ttools{display:flex}
.tt{border:0;background:transparent;border-radius:999px;padding:6px 11px;font-weight:800;font-size:.88rem;color:var(--ink-soft);white-space:nowrap}
.tt[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 2px 6px -3px rgba(0,0,0,.4)}
.tt.pen[aria-pressed="true"]{color:#d6336c}.tt.hl[aria-pressed="true"]{color:#b08900}.tt.veil[aria-pressed="true"]{color:var(--teal-deep)}
.teach #bagBtn,.teach .seg,.teach #tip{display:none!important}
.teach .rbar{padding-block:8px 6px}
.teach #reader{padding-inline:8px}
.teach .nav{position:fixed;inset:auto 0 10px 0;padding:0;pointer-events:none;z-index:6}
.teach .nav #pno{pointer-events:auto;opacity:.85}
.teach .nav #prev,.teach .nav #next{pointer-events:auto;position:fixed;top:50%;transform:translateY(-50%);width:64px;height:64px;font-size:2rem;opacity:.8;box-shadow:var(--shadow)}
.teach .nav #prev{left:6px}.teach .nav #next{right:6px}
.teach .stage{padding-bottom:58px}
.ink{position:absolute;inset:0;z-index:4;pointer-events:none;touch-action:none}
.drawing .ink{pointer-events:auto;cursor:crosshair}
.book{position:relative}
.hit.veiled{background:#00adb9!important;box-shadow:inset 0 0 0 2px #00747c!important;border-radius:6px;outline:0!important}
.hit.veiled::after{content:"?";position:absolute;inset:0;display:grid;place-items:center;color:#04282b;font-family:var(--f-display);font-weight:800;font-size:clamp(.8rem,1.6vw,1.4rem)}
.veiling .hit{cursor:pointer}
.veiling .hit:hover{background:rgba(0,173,185,.35)}
/* bigger cards on the board */
.teach .pop{width:min(560px,calc(100vw - 24px));padding:18px 22px}
.teach .pop-w{font-size:2.6rem}
.teach .note{font-size:1.05rem}
.teach .tr li{grid-template-columns:120px 1fr}
.teach .tr .lb{font-size:.9rem}
.teach .tr .tx{font-size:1.6rem}
.teach .wpic{width:140px;height:140px}
.teach .sentbox .tq{font-size:1.5rem}
.teach .sentbox .tr .tx{font-size:1.25rem}
.teach .qz{width:min(900px,100%);padding:24px 28px}
.teach .qz.wide{width:min(980px,100%)}
.teach .qz-q p{font-size:2rem}
.teach .ava{width:84px;height:84px}
.teach .qz-who b{font-size:1.7rem}
.teach .opt{font-size:1.7rem;padding:16px 12px;position:relative}
.teach .opt img{width:110px;height:110px}
.teach .qz-tr li{font-size:1.2rem;grid-template-columns:110px 1fr}
.teach .slot{font-size:1.2rem;min-height:70px}
.teach .qz-fb{font-size:1.8rem}
.teach .qz-btn{font-size:1.15rem;padding:12px 22px}
.abc{position:absolute;top:6px;left:8px;width:30px;height:30px;border-radius:50%;background:var(--desk-2);color:var(--ink);font-family:var(--f-body);font-size:1rem;font-weight:800;display:grid;place-items:center}
.opt.ok .abc{background:#2f9e5b;color:#fff}.opt.no .abc{background:#d9534f;color:#fff}.opt.pick .abc{background:#00adb9;color:#05292c}
.qz-btn.show{background:#ffd43b;color:#3a2e00}
@media (max-width:760px){.tt{padding:6px 8px;font-size:.8rem}}

/* narration */
.qz .qw{border-radius:5px;transition:background .08s}
.qz .qw.kara{background:rgba(255,212,59,.65);box-shadow:inset 0 -3px 0 #e0b100}
.qz .opt.kara{outline:4px solid #ffd43b;outline-offset:2px}
.nav #playBtn{background:#00adb9;border-color:#00adb9;color:#05292c;font-size:1.25rem}

.nav #rateBtn{width:auto;min-width:56px;border-radius:999px;font-size:.95rem;padding:0 12px}

.teach .nav #playBtn,.teach .nav #rateBtn{pointer-events:auto}

.ic{width:1.2em;height:1.2em;flex:none;vertical-align:-.22em;pointer-events:none}
.tbtn,.tt,.back,.act,.qz-btn,.back-q{display:inline-flex;align-items:center;gap:6px}
.round .ic{width:1.25em;height:1.25em}
.nav #prev,.nav #next{display:inline-grid;place-items:center}
.nav #playBtn{width:auto!important;padding:0 20px 0 16px;border-radius:999px;display:inline-flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:1.1rem;box-shadow:0 3px 0 #00747c}
.nav #playBtn .ic{width:1.3em;height:1.3em}
.nav #sfxBtn{display:inline-grid;place-items:center}
.nav #sfxBtn[aria-pressed="false"]{opacity:.55}
.stars .ic{color:#ffc21a;width:1.6em;height:1.6em}.stars .off{color:#c9d6d7}
.qz-fb.ok .ic{width:1.3em;height:1.3em}
.cog .ic,.star .ic{color:#e0a800}
/* oynat ipucu */
.playtip{position:fixed;z-index:60;background:#15302f;color:#fff;font-weight:800;padding:8px 14px;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.25);pointer-events:none;animation:tipb 1.2s ease-in-out infinite alternate}
.playtip::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#15302f}
@keyframes tipb{to{transform:translateY(-4px)}}
/* alt yazi */
.subbar{position:relative;margin:4px auto 0;overflow:hidden;box-sizing:border-box;max-width:min(980px,96vw);background:var(--card);border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,.08);padding:8px 14px;font-size:.98rem;line-height:1.35}
.subbar b{display:block;font-family:var(--f-display);font-size:1.12rem;color:var(--ink)}
.subbar span{display:block;color:var(--ink-soft)} .subbar i{font-style:normal;font-weight:800;color:var(--teal-deep);margin-right:6px;font-size:.8rem}
.teach .subbar{font-size:1.2rem}.teach .subbar b{font-size:1.45rem}
#trBtn .lbl{font-weight:800}
/* sayfa katlanma */
.foldwrap{position:absolute;pointer-events:none;z-index:5;overflow:hidden;will-change:transform;box-shadow:0 0 30px rgba(0,0,0,.25)}
.foldwrap > .book{position:absolute;top:0;margin:0;height:100%!important}
.foldwrap.fwd{transform-origin:left center;animation:foldF .45s cubic-bezier(.45,0,.75,.4) forwards}
.foldwrap.bwd{transform-origin:right center;animation:foldB .45s cubic-bezier(.45,0,.75,.4) forwards}
@keyframes foldF{0%{transform:scaleX(1);filter:brightness(1)}100%{transform:scaleX(0);filter:brightness(.6)}}
@keyframes foldB{0%{transform:scaleX(1);filter:brightness(1)}100%{transform:scaleX(0);filter:brightness(.6)}}
@media (prefers-reduced-motion:reduce){.foldwrap{display:none}}

const ICO = {"play": "<svg class=\"ic\" viewBox=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M240,128a15.74,15.74,0,0,1-7.6,13.51L88.32,229.65a16,16,0,0,1-16.2.3A15.86,15.86,0,0,1,64,216.13V39.87a15.86,15.86,0,0,1,8.12-13.82,16,16,0,0,1,16.2.3L232.4,114.49A15.74,15.74,0,0,1,240,128Z\"/></svg>", "pause": "<svg class=\"ic\" viewBox=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M216,48V208a16,16,0,0,1-16,16H160a16,16,0,0,1-16-16V48a16,16,0,0,1,16-16h40A16,16,0,0,1,216,48ZM96,32H56A16,16,0,0,0,40,48V208a16,16,0,0,0,16,16H96a16,16,0,0,0,16-16V48A16,16,0,0,0,96,32Z\"/></svg>", "sOn": "<svg class=\"ic\" viewBox=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M168,32V224a8,8,0,0,1-12.91,6.31L85.25,176H40a16,16,0,0,1-16-16V96A16,16,0,0,1,40,80H85.25l69.84-54.31A8,8,0,0,1,168,32Zm32,64a8,8,0,0,0-8,8v48a8,8,0,0,0,16,0V104A8,8,0,0,0,200,96Zm32-16a8,8,0,0,0-8,8v80a8,8,0,0,0,16,0V88A8,8,0,0,0,232,80Z\"/></svg>", "sOff": "<svg class=\"ic\" viewBox=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M221.92,210.62a8,8,0,1,1-11.84,10.76L168,175.09v48.6a8.29,8.29,0,0,1-3.91,7.18,8,8,0,0,1-9-.56L85.25,176H40a16,16,0,0,1-16-16V96A16,16,0,0,1,40,80H81.55L50.08,45.38A8,8,0,0,1,61.92,34.62ZM200.53,160a8.17,8.17,0,0,0,7.47-8.25V104.27A8.17,8.17,0,0,0,200.53,96a8,8,0,0,0-8.53,8v48A8,8,0,0,0,200.53,160ZM161,119.87a4,4,0,0,0,7-2.7V32.24a8.25,8.25,0,0,0-2.88-6.39,8,8,0,0,0-10-.16L111.83,59.33a4,4,0,0,0-.5,5.85ZM231.47,80A8.17,8.17,0,0,0,224,88.27v79.46a8.17,8.17,0,0,0,7.47,8.25,8,8,0,0,0,8.53-8V88A8,8,0,0,0,231.47,80Z\"/></svg>", "head": "<svg class=\"ic\" viewBox=\"0 0 256 256\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M232,128v56a24,24,0,0,1-24,24H192a24,24,0,0,1-24-24V144a24,24,0,0,1,24-24h23.65a87.71,87.71,0,0,0-87-80H128a88,88,0,0,0-87.64,80H64a24,24,0,0,1,24,24v40a24,24,0,0,1-24,24H48a24,24,0,0,1-24-24V128A104.11,104.11,0,0,1,201.89,54.66,103.41,103.41,0,0,1,232,128Z\"/></svg>"};

const LBL = {en:'English', ky:'Кыргызча', ru:'Русский'};
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let LIB = null, BOOK = null;
let langs = store.get('or.langs', ['en','ky','ru']);

let bag = [], cur = 1, active = null, showSent = false, two = false;

let trMode = store.get('or.trmode', 'off'), subSid = null;
const TRM = {off:'Kapalı', card:'Kartta', bar:'Altta'};
function syncTr(){
  $('#trBtn .lbl').textContent = 'Cümle: ' + TRM[trMode]; $('#trBtn').setAttribute('aria-pressed', trMode !== 'off');
  const sb = $('#subbar'), was = sb.hidden; sb.hidden = trMode !== 'bar';
  if(!sb.hidden && !subSid) sb.innerHTML = '<span>Bir kelimeye dokun ya da “Sesli dinle”ye bas: cümlenin çevirisi burada görünür.</span>';
  if(was !== sb.hidden && BOOK) layout(); else sizeSub();
}
function showSub(sid){
  if(trMode !== 'bar' || !BOOK || !BOOK.sent[sid] || sid === subSid) return;
  subSid = sid; $('#subbar').innerHTML = subHtml(sid); fitSub();
}
function subHtml(sid){
  const s = BOOK.sent[sid];
  return `<b>${s.tr}</b>` + langs.map(l => `<span><i>${l === 'ky' ? 'KG' : l.toUpperCase()}</i>${s[l]}</span>`).join('');
}
// Altyazı şeridi kitap boyunca sabit boyda (en uzun cümleye göre, en fazla ekranın %20'si); okurken ve sayfa çevirirken kitap boyu değişmez.
// Sığmayan uzun cümlede yalnız yazı küçülür.
function sizeSub(){
  const sb = $('#subbar'); if(sb.hidden || !BOOK || $('#reader').hidden) return;
  const key = BOOK.id + langs.join() + sb.offsetWidth + innerHeight; if(sb.dataset.k === key) return; sb.dataset.k = key;
  const sids = Object.keys(BOOK.sent);
  const m = sb.cloneNode(false); m.removeAttribute('id'); m.hidden = false;
  m.style.cssText = `position:absolute;visibility:hidden;left:0;top:0;height:auto;width:${sb.offsetWidth}px;max-width:none`;
  document.body.appendChild(m);
  let max = 0;
  for(const k of sids){ m.innerHTML = subHtml(k); max = Math.max(max, m.offsetHeight); }
  if(!sids.length){ m.innerHTML = sb.innerHTML; max = m.offsetHeight; }
  m.remove();
  sb.style.height = Math.min(max, Math.round(innerHeight * .2)) + 'px'; fitSub();
}
function fitSub(){
  const sb = $('#subbar'); if(sb.hidden) return;
  let fs = 1; sb.style.fontSize = '';
  while(sb.scrollHeight > sb.clientHeight + 1 && fs > .6){ fs -= .06; sb.style.fontSize = fs + 'em'; }
}

/* ---------- library ---------- */
async function loadLib(){
  if(LIB) return LIB;
  LIB = await (await fetch('library.json')).json();
  return LIB;
}
const ICO_OK = '<svg class="ic" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M232.49 80.49l-128 128a12 12 0 0 1-17 0l-56-56a12 12 0 1 1 17-17L96 183 215.51 63.51a12 12 0 0 1 17 17Z"/></svg>';
let LCOLS = [], LCOLA = [], LCUR = -1;
function lvInfo(sh){
  const [lv, age] = sh.sub.split(' · ');
  return {lv, age: age || '', grade: /Sınıf$/.test(sh.title) ? sh.title.replace('Sınıf', 'sınıf') : ''};
}
function renderLib(){
  const S = LIB.shelves;
  // Duvar: seviyeler sütunlara bir atlayarak yerleşir; komşu sütunlarda aynı kitap olmaz.
  const NC = Math.max(7, Math.round(innerWidth / 120) + 3);
  LCOLS = []; LCOLA = [];
  for(let c = 0; c < NC; c++){
    const mine = S.map((s, i) => i).filter(i => (i + c) % 2 === 0), h = Math.floor(c / 2);
    const A = mine.map(i => ({id: S[i].books[h % S[i].books.length].id, lv: i}));
    const B = mine.map(i => { const n = S[i].books.length; return {id: S[i].books[(h + 1 + Math.floor(n / 2)) % n].id, lv: i}; });
    LCOLA.push(Object.fromEntries(A.map(x => [x.lv, x.id])));
    const s = [...A, ...B], r = (c * 3) % s.length; LCOLS.push([...s.slice(r), ...s.slice(0, r)]);
  }
  $('#cols').innerHTML = LCOLS.map((list, c) => `<div class="col"><div class="track" style="--d:${60 + (c % 4) * 12}s">${
    [...list, ...list].map(x => `<button class="tile" data-id="${x.id}" data-lv="${x.lv}" tabindex="-1"><img src="books/${x.id}/kapak-k.jpg" alt="" decoding="async"></button>`).join('')}</div></div>`).join('');
  $('#levels').innerHTML = S.map((sh, i) => { const f = lvInfo(sh); return `<button class="lvb" aria-pressed="false" data-i="${i}"><b>${f.lv}</b><small>${f.age}</small></button>`; }).join('');
  $('#levels').querySelectorAll('.lvb').forEach(b => b.onclick = () => pickLevel(+b.dataset.i));
  $('#cols').querySelectorAll('.tile').forEach(t => t.onclick = () => { pickLevel(+t.dataset.lv); $('#series').scrollIntoView({behavior:'smooth', block:'start'}); });
  const g = store.get('or.grade', null), gi = S.findIndex(s => 'raf-' + s.id === g || s.id === g);
  LCUR = -1; pickLevel(gi >= 0 ? gi : 0, true);
}
function pickLevel(i, first){
  const sh = LIB.shelves[i], f = lvInfo(sh), on = new Set(sh.books.map(b => b.id)), wall = $('#wallx');
  store.set('or.grade', 'raf-' + sh.id);
  $('#levels').querySelectorAll('.lvb').forEach(b => b.setAttribute('aria-pressed', +b.dataset.i === i));
  const sel = $('#levels').querySelector(`.lvb[data-i="${i}"]`), bar = $('#levels'); if(sel) bar.scrollTo({left: sel.offsetLeft - (bar.clientWidth - sel.offsetWidth) / 2, behavior: first ? 'auto' : 'smooth'});
  if(i !== LCUR){
    LCUR = i;
    const apply = () => {
      wall.classList.add('pick');
      wall.querySelectorAll('.tile').forEach(t => t.classList.toggle('hi', on.has(t.dataset.id)));
      // Setin her kitabı ayrı sütunda, farklı yükseklikte görünür alana gelir
      const wh = wall.clientHeight;
      wall.querySelectorAll('.col').forEach((col, c) => {
        const tr = col.firstElementChild, want = LCOLA[c][i]; if(!want) return;
        const hi = tr.querySelector(`.tile[data-id="${want}"]`); if(!hi) return;
        const step = hi.offsetHeight + 12, P = LCOLS[c].length * step, d = parseFloat(tr.style.getPropertyValue('--d'));
        const target = 160 + wh * (0.18 + 0.5 * (((c * 37) % 100) / 100));
        const T = target - (hi.offsetTop + hi.offsetHeight / 2), m = (((-T) % P) + P) % P, p = (c % 2) ? 1 - m / P : m / P;
        tr.style.animation = 'none'; void tr.offsetWidth; tr.style.animation = ''; tr.style.animationDelay = (-p * d) + 's';
      });
    };
    if(first) requestAnimationFrame(apply); else { wall.classList.add('shuffle'); setTimeout(() => { apply(); wall.classList.remove('shuffle'); }, 260); }
  }
  $('#series').innerHTML = `<header><h2>${f.lv}</h2><span class="sm">${[f.age, f.grade, sh.books.length + ' kitap'].filter(Boolean).join(', ')}</span><p class="hint">Okumak istediğin kitaba dokun.</p></header>
    <div class="grid">${sh.books.map((b, k) => bookCard(b, k)).join('')}</div>`;
  $('#series').querySelectorAll('.bk.ready').forEach(el => el.onclick = () => chooseStart(el.dataset.id));
}
function bookCard(b, k){
  const last = store.get('or.page.' + b.id, 0), done = b.ready && last >= b.pages;
  return `<button class="bk ${b.ready ? 'ready' : 'soon'}" data-id="${b.id}" style="--k:${k}" ${b.ready ? '' : 'aria-disabled="true" tabindex="-1"'}>
    <span class="c"><img src="books/${b.id}/kapak-k.jpg" alt="${b.title} kapağı" loading="lazy">
      ${b.ready && b.audio ? '<span class="wave" title="Sesli kitap"><i></i><i></i><i></i><i></i></span>' : ''}
      ${!b.ready ? '<span class="soont">Yakında</span>' : b.new ? '<span class="newt">Yeni</span>' : ''}
      ${done ? `<span class="okd" title="Okudun">${ICO_OK}</span>` : ''}</span>
    <span class="t">${b.title}</span></button>`;
}

function chooseStart(id){
  const b = LIB.shelves.flatMap(s => s.books).find(x => x.id === id), last = store.get('or.page.' + id, 0);
  if(!last || last <= 1){ store.set('or.page.' + id, 1); location.hash = id; return; }
  $('#qz').className = 'qz';
  $('#qz').innerHTML = `
    <div class="qz-h"><img class="cover-sm" src="books/${id}/cover.jpg" alt=""><div class="qz-who"><b>${b.title}</b><small>Kaldığın yer: s. ${last}</small></div></div>
    <div class="choose">
      <button class="qz-btn main" data-go="cont">Kaldığın yerden devam et <span>s. ${last} <svg class="ic" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M181.66,133.66l-80,80A8,8,0,0,1,88,208V48a8,8,0,0,1,13.66-5.66l80,80A8,8,0,0,1,181.66,133.66Z"/></svg></span></button>
      <button class="qz-btn alt" data-go="start">Baştan başla <span><svg class="ic" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M208,47.88V208.12a16,16,0,0,1-24.43,13.43L64,146.77V216a8,8,0,0,1-16,0V40a8,8,0,0,1,16,0v69.23L183.57,34.45A15.95,15.95,0,0,1,208,47.88Z"/></svg></span></button>
    </div>`;
  $('#qzScrim').hidden = false;
  $('#qz').querySelector('[data-go="cont"]').onclick = () => { $('#qzScrim').hidden = true; location.hash = id; };
  $('#qz').querySelector('[data-go="start"]').onclick = () => { $('#qzScrim').hidden = true; store.set('or.page.' + id, 1); location.hash = id; };
}
$('#qzScrim').addEventListener('click', e => { if(e.target === $('#qzScrim') && !QS){ $('#qzScrim').hidden = true; } });

/* ---------- usage counter (Abacus, no account, no personal data): every visit counts ---------- */
const CNT = 'https://abacus.jasoncameron.dev', NS = 'akilli-kitaplik-gk';
function hit(key){ return fetch(`${CNT}/hit/${NS}/${key}`).then(r => r.ok ? r.json() : null).then(j => j ? j.value : null).catch(() => null); }
async function showCount(){
  const v = await hit('acilis');
  if(v === null) return;
  $('#cnt b').textContent = Number(v).toLocaleString('tr-TR'); $('#cnt').hidden = false;
}

/* ---------- routing ---------- */
async function route(){
  closePop(); closeBag();
  await loadLib();
  const id = location.hash.replace('#', '');
  const meta = LIB.shelves.flatMap(s => s.books).find(b => b.id === id && b.ready);
  if(meta){ await openBook(meta); hit('kitap-' + meta.id); }
  else { if(typeof stopPlay === 'function') stopPlay(); $('#reader').hidden = true; $('#lib').hidden = false; renderLib(); document.title = 'Akıllı Kitaplık'; }
}
window.addEventListener('hashchange', route);
$('#backBtn').onclick = () => { location.hash = ''; };

/* ---------- reader ---------- */
async function openBook(meta){
  if(!BOOK || BOOK.id !== meta.id){
    BOOK = await (await fetch(`books/${meta.id}/book.json`)).json();
  }
  $('#lib').hidden = true; $('#reader').hidden = false;
  $('#rTitle').textContent = BOOK.title; document.title = BOOK.title + ' · Akıllı Kitaplık';
  bag = store.get('or.bag.' + BOOK.id, []);
  cur = Math.max(1, store.get('or.page.' + BOOK.id, 1));
  quizDone = new Set(); sessionStars = new Set(); $('#backQ').hidden = true;
  stopPlay(); drawnKey = ''; renderBag(); syncLangs(); syncHints(); syncQuiz(); layout(); loadSes();
  syncTeach(false);
  subSid = null; syncTr();
  const tip = $('#tip'); if(!T) tip.classList.remove('gone'); setTimeout(() => tip.classList.add('gone'), 5000);
}
function asp(){ return BOOK.aspect ? BOOK.aspect[0] / BOOK.aspect[1] : 680.31 / 623.62; }
function spreadOf(n){
  if(!two) return [n];
  const N = BOOK.pages.length;
  if(n === 1) return [1];
  if(n === N && N % 2 === 0) return [N];
  const l = n % 2 === 0 ? n : n - 1;
  return [l, l + 1].filter(x => x <= N);
}
function layout(){
  if($('#reader').hidden) return;
  two = window.innerWidth >= 760 && window.innerWidth > window.innerHeight * (BOOK && BOOK.aspect && asp() < 1 ? 1.2 * asp() * 2 * 0.62 : 1.05);
  draw();
}
function draw(){
  closePop(); pageChanged();
  const pages = spreadOf(cur), bookEl = $('#book'), stage = $('#stage');
  bookEl.innerHTML = ''; bookEl.classList.toggle('two', pages.length === 2);
  pages.forEach(n => bookEl.appendChild(pageEl(BOOK.pages[n - 1])));
  sizeSub();
  // size: fit spread inside stage
  const ratio = asp() * pages.length;
  const sw = stage.clientWidth, sh = stage.clientHeight;
  let h = Math.min(sh, sw / ratio);
  sizeBook(h);
  const N = BOOK.pages.length;
  $('#pno').textContent = pages.length === 2 ? `${pages[0]}–${pages[1]} / ${N}` : `${pages[0]} / ${N}`;
  $('#prev').disabled = pages[0] <= 1;
  const endQ = pages[pages.length - 1] >= N ? pendingFor(pages) : [];
  $('#next').disabled = pages[pages.length - 1] >= N && !endQ.length;
  $('#next').innerHTML = pages[pages.length - 1] >= N && endQ.length ? '<svg class="ic" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M128,24A104,104,0,1,0,232,128,104.11,104.11,0,0,0,128,24Zm45.66,85.66-56,56a8,8,0,0,1-11.32,0l-24-24a8,8,0,0,1,11.32-11.32L112,148.69l50.34-50.35a8,8,0,0,1,11.32,11.32Z"/></svg>' : '<svg class="ic" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M181.66,133.66l-80,80A8,8,0,0,1,88,208V48a8,8,0,0,1,13.66-5.66l80,80A8,8,0,0,1,181.66,133.66Z"/></svg>';
  if(!T) store.set('or.page.' + BOOK.id, pages[pages.length - 1]);
  syncPlayUI();
  setupInk();
  // preload neighbours
  [pages[0] - 2, pages[0] - 1, pages[pages.length - 1] + 1, pages[pages.length - 1] + 2].forEach(n => {
    if(n >= 1 && n <= N){ const im = new Image(); im.src = `books/${BOOK.id}/${BOOK.pages[n - 1].img}`; }
  });
}
function sizeBook(h){
  const bk = $('#book'); bk.style.height = h + 'px'; bk.style.width = (h * asp() * bk.querySelectorAll('.page').length) + 'px';
  bk.querySelectorAll('.page').forEach(pg => pg.style.width = (h * asp()) + 'px');
}
function fitBook(){
  if(!BOOK || $('#reader').hidden) return;
  const bk = $('#book'), st = $('#stage'), n = bk.children.length ? bk.querySelectorAll('.page').length : 0; if(!n) return;
  const ratio = asp() * n, h = Math.min(st.clientHeight, st.clientWidth / ratio);
  if(Math.abs(parseFloat(bk.style.height) - h) > 1){ sizeBook(h); if(active) place(active); }
}
if(window.ResizeObserver){ const ro = new ResizeObserver(() => fitBook()); addEventListener('load', () => ro.observe($('#stage'))); ro.observe(document.querySelector('#stage') || document.body); }
function pageEl(p){
  const pg = document.createElement('div'); pg.className = 'page';
  if(BOOK.aspect) pg.style.aspectRatio = BOOK.aspect[0] + '/' + BOOK.aspect[1];
  pg.innerHTML = `<img src="books/${BOOK.id}/${p.img}" alt="Sayfa ${p.no}">`;
  p.words.forEach(w => {
    const b = document.createElement('button');
    b.className = 'hit' + (w.banner ? ' banner' : '');
    b.style.cssText = `left:${w.b[0]}%;top:${w.b[1]}%;width:${w.b[2]}%;height:${w.b[3]}%`;
    b.setAttribute('aria-label', w.t);
    b.dataset.k = w.k; b.dataset.s = w.s;
    b.addEventListener('click', ev => { ev.stopPropagation(); if(T && tool === 'veil'){ toggleVeil(b); return; } if(b.classList.contains('veiled')){ unveil(b); return; } openWord(b); });
    pg.appendChild(b);
  });
  return pg;
}
function go(d, auto){
  stopPlay(true);
  if(!$('#qzScrim').hidden) return;
  const pages = spreadOf(cur), N = BOOK.pages.length;
  const n = d > 0 ? pages[pages.length - 1] + 1 : pages[0] - 1;
  if(d > 0){
    const q = pendingFor(pages);
    if(q.length){ startQuiz(q, () => { if(n <= N){ cur = n; draw(); } else finishCard(); }); return; }
  }
  if(n < 1 || n > N) return;
  turnFx(d); cur = n; draw();
}
const SFX = [1,2,3].map(i => { const a = new Audio(`sesler/sayfa-${i}.mp3`); a.volume = .6; a.preload = 'auto'; return a; }); let sfxOn = store.get('or.sfx', true);
function syncSfx(){ $('#sfxBtn').innerHTML = sfxOn ? ICO.sOn : ICO.sOff; $('#sfxBtn').setAttribute('aria-pressed', sfxOn); }
function turnFx(d){
  if(sfxOn){ try{ const a = SFX[Math.floor(Math.random() * SFX.length)]; a.currentTime = 0; a.play().catch(() => {}); }catch(e){} }
  const bk = $('#book'), st = $('#stage'); if(!bk.children.length) return;
  const rb = bk.getBoundingClientRect(), rs = st.getBoundingClientRect(), dbl = bk.classList.contains('two');
  const half = dbl ? rb.width / 2 : rb.width, x0 = rb.left - rs.left + (dbl && d > 0 ? half : 0);
  const w = document.createElement('div'); w.className = 'foldwrap ' + (d > 0 ? 'fwd' : 'bwd');
  if(!dbl && d < 0) w.style.transformOrigin = 'right center';
  w.style.cssText += `;left:${x0}px;top:${rb.top - rs.top}px;width:${half}px;height:${rb.height}px`;
  const c = bk.cloneNode(true); c.removeAttribute('id'); c.querySelectorAll('canvas,.hit').forEach(x => x.remove());
  c.style.setProperty('width', rb.width + 'px', 'important'); c.style.setProperty('max-width', 'none', 'important'); c.style.left = (dbl && d > 0 ? -half : 0) + 'px';
  w.appendChild(c); st.appendChild(w); setTimeout(() => w.remove(), 470);
}
$('#pno').onclick = e => {
  e.stopPropagation(); closePop();
  const pages = spreadOf(cur), N = BOOK.pages.length;
  $('#qz').className = 'qz wide';

let strokes = [], inkC = null;
function setupInk(){
  strokes = [];

  inkC = document.createElement('canvas'); inkC.className = 'ink'; book.appendChild(inkC);
  const r = book.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  inkC.width = Math.round(r.width * dpr); inkC.height = Math.round(r.height * dpr);
  let s = null;
  const pt = ev => { const b = inkC.getBoundingClientRect(); return [(ev.clientX - b.left) / b.width, (ev.clientY - b.top) / b.height]; };
  inkC.addEventListener('pointerdown', ev => { if(!(T && (tool === 'pen' || tool === 'hl'))) return; ev.preventDefault(); ev.stopPropagation(); inkC.setPointerCapture(ev.pointerId); s = {t:tool, p:[pt(ev)]}; strokes.push(s); paint(); });
  inkC.addEventListener('pointermove', ev => { if(!s) return; ev.preventDefault(); s.p.push(pt(ev)); paint(); });
  const end = () => { s = null; };
  inkC.addEventListener('pointerup', end); inkC.addEventListener('pointercancel', end);
  inkC.addEventListener('click', ev => ev.stopPropagation());
}
function paint(){
  if(!inkC) return;
  const c = inkC.getContext('2d'), W = inkC.width, H = inkC.height;
  c.clearRect(0, 0, W, H); c.lineCap = 'round'; c.lineJoin = 'round';
  strokes.forEach(s => {
    c.strokeStyle = s.t === 'pen' ? '#e8590c' : 'rgba(255,212,59,.5)';
    c.lineWidth = (s.t === 'pen' ? .004 : .028) * W;
    c.beginPath(); s.p.forEach(([x, y], i) => i ? c.lineTo(x * W, y * H) : c.moveTo(x * W, y * H));
    if(s.p.length === 1) c.lineTo(s.p[0][0] * W + .5, s.p[0][1] * H);
    c.stroke();
  });
}

  st.pick = i; st.tries++;

  else if(st.tries >= 2){ st.state = 'revealed'; }

    <div class="qz-foot"><button class="qz-btn alt" data-close>Kapat</button><button class="qz-btn alt" data-again><svg class="ic" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M208,47.88V208.12a16,16,0,0,1-24.43,13.43L64,146.77V216a8,8,0,0,1-16,0V40a8,8,0,0,1,16,0v69.23L183.57,34.45A15.95,15.95,0,0,1,208,47.88Z"/></svg> Baştan oku</button><button class="qz-btn main" data-shelf>Rafa dön</button></div>`;
  $('#qzScrim').hidden = false;
  $('#qz').querySelector('[data-close]').onclick = () => { $('#qzScrim').hidden = true; draw(); };
  $('#qz').querySelector('[data-again]').onclick = () => { $('#qzScrim').hidden = true; quizDone = new Set(); sessionStars = new Set(); cur = 1; draw(); };
  $('#qz').querySelector('[data-shelf]').onclick = () => { $('#qzScrim').hidden = true; location.hash = ''; };
}
$('#qz').addEventListener('click', e => e.stopPropagation());

/* ---------- güncel sürüm kontrolü: tarayıcı eski sayfayı tutuyorsa yenisini yükle ---------- */
const APPV='202611290500';
fetch('version.json?t=' + Date.now(), {cache: 'no-store'}).then(r => r.ok ? r.json() : null).then(j => {
  if(!j || !j.v || j.v === APPV) return;
  const u = new URL(location.href);
  if(u.searchParams.get('v') === j.v) return;      // zaten denendi, döngüye girme
  u.searchParams.set('v', j.v); location.replace(u.toString());
}).catch(() => {});
route();
showCount();
